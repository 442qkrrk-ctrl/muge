<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge v3.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #bookingSection, #adminPanel, #userInfo { display: none; }
        
        /* 캘린더 커스텀 */
        .fc { background: white; padding: 10px; border-radius: 1rem; border: 1px solid #e2e8f0; height: 78vh; }
        
        /* [v3.4] 월 보기(DayGrid) 전용 텍스트 스타일 */
        .month-event-box { display: flex; align-items: center; gap: 4px; padding: 1px 2px; overflow: hidden; }
        .month-time { font-size: 0.65rem; background: rgba(255,255,255,0.2); padding: 0 3px; border-radius: 3px; font-weight: 400; }
        .month-room { font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* [v3.4] 주 보기(TimeGrid) 전용 스타일 */
        .week-event-box { padding: 4px; line-height: 1.3; }
        .week-room { font-size: 0.85rem; font-weight: 800; display: block; }
        .week-user { font-size: 0.75rem; font-weight: 400; opacity: 0.9; }

        .fc-event { border: none !important; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen py-6 text-slate-900">

    <div class="max-w-4xl mx-auto px-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-indigo-600 to-blue-500 bg-clip-text text-transparent">Muge v3.4</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-xs font-bold block"></span>
                <button id="btnLogout" class="text-[10px] text-red-500 hover:underline">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <input type="email" id="emailInput" placeholder="이메일" class="w-full px-4 py-2 rounded-xl border outline-none focus:border-blue-500">
                <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full px-4 py-2 rounded-xl border outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2">
                <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">로그인</button>
                <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 transition">회원가입</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-l-blue-500 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                <select id="roomName" class="px-4 py-2 rounded-xl border bg-slate-50 outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="px-4 py-2 rounded-xl border outline-none">
                <select id="bookTimeSelect" class="px-4 py-2 rounded-xl border outline-none"></select>
            </div>
            <button id="btnSave" class="w-full bg-slate-900 text-white font-black py-3 rounded-xl hover:bg-black transition">예약하기</button>
        </section>

        <div id="calendar" class="mb-8"></div>

        <section id="adminPanel" class="bg-orange-50 p-5 rounded-2xl border border-orange-200">
            <h2 class="text-sm font-black text-orange-700 mb-4 uppercase tracking-wider">Admin Control</h2>
            <div id="userList" class="space-y-2"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, getDocs, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserData = null;

        // 시간 옵션
        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 22; h++) {
            for (let m of ['00', '30']) {
                if (h === 22 && m === '30') continue;
                const hh = String(h).padStart(2, '0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${m}`; opt.textContent = `${hh}:${m}`;
                timeSelect.appendChild(opt);
            }
        }

        // 캘린더 렌더링
        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'timeGridWeek',
            locale: 'ko',
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            displayEventTime: false,
            allDaySlot: false,
            eventContent: function(arg) {
                const room = arg.event.title.split(' | ')[0];
                const user = arg.event.title.split(' | ')[1];
                const timeText = arg.event.extendedProps.shortTime; // 저장된 시간 문자열

                if (arg.view.type === 'dayGridMonth') {
                    // [v3.4 월 보기] 시간 + 장소 (예약자 삭제)
                    return { html: `
                        <div class="month-event-box">
                            <span class="month-time">${timeText}</span>
                            <span class="month-room">${room}</span>
                        </div>` 
                    };
                } else {
                    // [v3.4 주 보기] 장소 + 예약자 (시간은 좌측축에 있으므로 제외)
                    return { html: `
                        <div class="week-event-box">
                            <span class="week-room">${room}</span>
                            <span class="week-user">👤 ${user}</span>
                        </div>` 
                    };
                }
            },
            eventClick: async function(info) {
                const owner = info.event.extendedProps.user;
                if (auth.currentUser?.email === owner || currentUserData?.isAdmin) {
                    if (confirm("예약을 삭제하시겠습니까?")) await deleteDoc(doc(db, "reservations", info.event.id));
                } else alert("권한이 없습니다.");
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userInfo.style.display = 'block'; authForm.style.display = 'none'; bookingSection.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if(snap.exists()) {
                        currentUserData = snap.data();
                        if(currentUserData.isAdmin) { adminPanel.style.display = 'block'; loadUserList(); }
                    }
                });
            } else { userInfo.style.display = 'none'; authForm.style.display = 'block'; bookingSection.style.display = 'none'; adminPanel.style.display = 'none'; }
        });

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTimeSelect').value;
            if(!date) return alert("날짜를 선택하세요.");
            const fullTime = `${date}T${time}`;
            
            const q = query(collection(db, "reservations"), where("room", "==", room));
            const snap = await getDocs(q);
            let isConflict = false;
            snap.forEach(d => { if (Math.abs(new Date(fullTime).getTime() - new Date(d.data().time).getTime()) < 2*60*60*1000) isConflict = true; });
            
            if (isConflict) return alert("중복 예약 불가(2시간 간격)");
            await addDoc(collection(db, "reservations"), { 
                user: auth.currentUser.email, 
                room, 
                time: fullTime,
                shortTime: time // 월 보기용 시간 저장
            });
            alert("예약 완료!");
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({
                    id: doc.id,
                    title: `${d.room} | ${d.user.split('@')[0]}`,
                    start: d.time,
                    backgroundColor: getRoomColor(d.room),
                    extendedProps: { user: d.user, shortTime: d.shortTime }
                });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#ef4444", "제빵실": "#f59e0b", "공작실": "#10b981", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room] || "#64748b";
        }

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        document.getElementById('btnSignup').onclick = async () => {
            const u = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            await setDoc(doc(db, "users", u.user.uid), { email: emailInput.value, approved: false, isAdmin: false });
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        function loadUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList'); list.innerHTML = "";
                snap.forEach(uDoc => { if(uDoc.data().email !== auth.currentUser.email) list.innerHTML += `<div class="flex justify-between items-center p-3 bg-white rounded-xl border border-orange-100 text-xs shadow-sm"><span>${uDoc.data().email}</span><button onclick="window.toggleUser('${uDoc.id}', ${uDoc.data().approved})" class="bg-orange-200 px-3 py-1 rounded-lg font-bold">${uDoc.data().approved ? '승인됨' : '대기중'}</button></div>`; });
            });
        }
        window.toggleUser = (id, cur) => updateDoc(doc(db, 'users', id), { approved: !cur });
    </script>
</body>
</html>
