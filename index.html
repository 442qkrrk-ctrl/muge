<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge 관리자 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .admin-badge { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen py-10">

    <div class="max-w-xl mx-auto px-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">🎸 Muge 통합 시스템</h1>
            <p class="text-slate-500 mt-2 font-medium">v1.7 UID 직통 연결 모드</p>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div id="authForm">
                <h2 class="text-lg font-semibold mb-4 text-slate-700">멤버십 입장</h2>
                <div class="space-y-3">
                    <input type="email" id="email" placeholder="이메일 주소" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <input type="password" id="password" placeholder="비밀번호" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <div class="flex gap-2 pt-2">
                        <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">로그인</button>
                        <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg hover:bg-slate-200 transition">회원가입</button>
                    </div>
                </div>
            </div>

            <div id="userInfo" class="hidden flex items-center justify-between">
                <div>
                    <div id="userBadgeArea" class="mb-1 flex gap-1"></div>
                    <p id="userDisplay" class="font-bold text-slate-800"></p>
                </div>
                <button id="btnLogout" class="text-sm text-red-500 hover:font-bold transition">로그아웃</button>
            </div>
        </section>

        <section id="bookingSection" class="hidden animate-fade-in bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 border-l-4 border-l-blue-500">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">📅 새 예약 만들기</h2>
            <div class="space-y-4">
                <select id="roomName" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <option value="A룸 (큰방)">A룸 (큰방)</option>
                    <option value="B룸 (중간방)">B룸 (중간방)</option>
                    <option value="C룸 (개인연습)">C룸 (개인연습)</option>
                </select>
                <input type="datetime-local" id="bookTime" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <button id="btnSave" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">예약 확정</button>
            </div>
        </section>

        <section id="adminPanel" class="hidden bg-white p-6 rounded-2xl shadow-sm border-2 border-orange-200 mb-6 bg-orange-50/50">
            <h2 class="text-lg font-semibold mb-4 text-orange-700 flex items-center gap-2">
                <span>👑 회원 승인 관리</span>
                <span class="text-[10px] bg-orange-200 text-orange-700 px-2 py-0.5 rounded-full uppercase font-bold">Admin</span>
            </h2>
            <div id="userList" class="space-y-2 max-h-60 overflow-y-auto pr-2 text-sm text-slate-500">유저 정보를 불러오는 중...</div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">📋 실시간 예약 현황</h2>
            <div id="bookingList" class="space-y-3">
                <p class="text-slate-400 text-sm text-center py-4">동기화 중...</p>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            const authForm = document.getElementById('authForm'), userInfo = document.getElementById('userInfo');
            const bookingSection = document.getElementById('bookingSection'), adminPanel = document.getElementById('adminPanel');

            if (user) {
                authForm.classList.add('hidden'); userInfo.classList.remove('hidden');
                document.getElementById('userDisplay').textContent = user.email;

                // [핵심] UID 직접 참조 방식으로 데이터 감시
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if(!snap.exists()) {
                        console.log("유저 데이터가 DB에 없습니다. UID:", user.uid);
                        return;
                    }
                    const data = snap.data();
                    console.log("🔥 유저 데이터 로드 성공:", data);

                    const isApproved = String(data.approved) === "true";
                    const isManager = String(data.isAdmin) === "true";

                    const badgeArea = document.getElementById('userBadgeArea');
                    badgeArea.innerHTML = "";

                    // 승인 뱃지
                    const b = document.createElement('span');
                    b.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${isApproved ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`;
                    b.textContent = isApproved ? "승인됨" : "승인 대기";
                    badgeArea.appendChild(b);

                    // 예약 섹션 노출 여부
                    if(isApproved) bookingSection.classList.remove('hidden');
                    else bookingSection.classList.add('hidden');

                    // 관리자 설정
                    if(isManager) {
                        const ab = document.createElement('span');
                        ab.className = "text-[10px] font-bold px-2 py-0.5 rounded-full admin-badge text-white";
                        ab.textContent = "ADMIN";
                        badgeArea.appendChild(ab);
                        adminPanel.classList.remove('hidden');
                        loadUserList();
                    } else { adminPanel.classList.add('hidden'); }
                });
            } else {
                authForm.classList.remove('hidden'); userInfo.classList.add('hidden');
                bookingSection.classList.add('hidden'); adminPanel.classList.add('hidden');
            }
        });

        // 회원가입
        document.getElementById('btnSignup').onclick = async () => {
            const email = document.getElementById('email').value, pw = document.getElementById('password').value;
            if(!email || !pw) return alert("입력창을 채워주세요.");
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pw);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    email: email, isAdmin: false, approved: false, createdAt: serverTimestamp()
                });
                alert("가입 신청 완료! 관리자 승인을 기다려주세요.");
            } catch (e) { alert("에러: " + e.message); }
        };

        // 로그인/로그아웃
        document.getElementById('btnLogin').onclick = () => {
            const email = document.getElementById('email').value, pw = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pw).catch(e => alert("로그인 실패"));
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // 유저 리스트 로드
        function loadUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    if(u.email === auth.currentUser.email) return;
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-3 bg-white rounded-xl border border-orange-100 mb-1 shadow-sm";
                    div.innerHTML = `
                        <span class="text-xs font-medium text-slate-700">${u.email}</span>
                        <button class="px-3 py-1 rounded-lg text-[10px] font-bold ${u.approved ? 'bg-slate-200 text-slate-600' : 'bg-orange-500 text-white'}" 
                                onclick="window.toggleApprove('${uDoc.id}', ${u.approved})">
                            ${u.approved ? '승인 취소' : '승인'}
                        </button>`;
                    list.appendChild(div);
                });
            });
        }

        window.toggleApprove = async (id, status) => {
            const next = !(String(status) === "true");
            await updateDoc(doc(db, "users", id), { approved: next });
        };

        // 예약 저장
        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value, time = document.getElementById('bookTime').value;
            if(!time) return alert("시간을 선택해 주세요!");
            try {
                await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time, createdAt: serverTimestamp() });
                alert("예약 확정!");
            } catch (e) { alert("저장 실패"); }
        };

        // 실시간 예약 목록
        onSnapshot(query(collection(db, "reservations"), orderBy("time", "asc")), (snap) => {
            const list = document.getElementById('bookingList');
            list.innerHTML = snap.empty ? '<p class="text-slate-400 text-sm text-center py-4">예약 내역이 없습니다.</p>' : "";
            snap.forEach(doc => {
                const item = doc.data();
                list.innerHTML += `
                <div class="flex justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm mb-2 border-l-4 border-l-slate-300">
                    <div><p class="font-bold text-slate-800 text-sm">${item.room}</p><p class="text-slate-500 text-[10px] mt-1">⏰ ${item.time.replace('T',' ')}</p></div>
                    <div class="flex items-center"><span class="text-blue-600 font-bold text-xs bg-blue-50 px-2 py-1 rounded-md">${item.user.split('@')[0]}님</span></div>
                </div>`;
            });
        });
    </script>
</body>
</html>
