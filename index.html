<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 예약 (v1.9.1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        #calendar-container { background: white; border-radius: 20px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; margin-bottom: 50px; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900 !important; color: #065f46; }
        .fc-button { font-size: 0.8rem !important; font-weight: 800 !important; border-radius: 8px !important; }
        .fc-day-sat { background-color: #eff6ff !important; } 
        .holiday-cell { background-color: #fee2e2 !important; position: relative; }
        .holiday-cell::after { content: '휴관'; position: absolute; bottom: 2px; right: 5px; font-size: 9px; color: #ef4444; font-weight: 900; }
        .event-chip { font-size: 10px; padding: 4px; border-radius: 6px; color: white; font-weight: 700; width: 100%; cursor: pointer; border: none; }
        .bg-band { background-color: #10b981 !important; } .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; } .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        #toast { visibility: hidden; min-width: 200px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        /* 링크 스타일 제거 */
        .fc-col-header-cell-cushion { color: inherit !important; text-decoration: none !important; cursor: pointer; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <div><h1 class="text-xl font-black text-emerald-900">무계행복마을학교</h1><p class="text-[10px] font-bold text-emerald-600 tracking-tighter">시설 예약 시스템 (v1.9.1)</p></div>
            <div class="flex gap-2 items-center">
                <button id="btnAdminOpen" class="hidden text-[10px] bg-indigo-600 text-white px-3 py-2 rounded-xl font-black shadow-lg">관리자</button>
                <div id="loginInfo" class="text-right hidden"><span id="userNick" class="text-[11px] font-black block text-slate-700"></span><button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button></div>
            </div>
        </header>

        <div id="calendar-container"><div id="calendar"></div></div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-white max-w-sm p-6 rounded-[30px] shadow-2xl">
                <h3 id="modalDateDisplay" class="font-black text-lg text-center mb-6 text-slate-800">예약 신청</h3>
                <div class="space-y-4 mb-6">
                    <div><label class="text-[14px] font-bold text-slate-400 ml-1">시설 선택</label><select id="modalRoom" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none"><option value="밴드실">🎸 밴드실</option><option value="제빵실">🍞 제빵실</option><option value="공작실">🔨 공작실</option><option value="강의실">📖 강의실</option><option value="다목적실">✨ 다목적실</option></select></div>
                    <div><label class="text-[14px] font-bold text-slate-400 ml-1">시간 선택 (2시간 단위 중복 체크)</label><select id="modalTime" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none"></select></div>
                </div>
                <div class="bg-slate-900 p-5 rounded-2xl mb-6 text-slate-300">
                    <h4 class="text-[12px] font-black text-emerald-400 mb-2">📋 필수 이용 수칙</h4>
                    <ul class="text-[11px] space-y-1 mb-4 font-medium">
                        <li>• 퇴실 시 전등 및 냉난방기 OFF</li>
                        <li>• 사용하신 비품은 제자리에 정리</li>
                        <li>• 개인 쓰레기는 반드시 직접 수거</li>
                    </ul>
                    <label class="flex items-center gap-3 cursor-pointer pt-3 border-t border-slate-800">
                        <input type="checkbox" id="agreeRules" class="w-5 h-5 accent-emerald-500">
                        <span class="text-xs font-black text-white">위 수칙을 준수함에 동의합니다.</span>
                    </label>
                </div>
                <div class="flex gap-2"><button id="btnCloseBooking" class="flex-1 py-3 text-slate-400 font-bold">취소</button><button id="btnConfirm" disabled class="flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl">예약 확정</button></div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-slate-50 max-w-2xl p-6 rounded-[30px] shadow-2xl max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-6"><h3 class="font-black text-xl text-indigo-950">운영 관리</h3><button id="btnCloseAdmin" class="text-slate-400 font-bold">닫기</button></div>
                <section class="mb-8 p-4 bg-white rounded-2xl border"><h4 class="font-black text-sm mb-3 text-red-600">🗓 휴관일 설정</h4><div class="flex gap-2 mb-3"><input type="date" id="holidayDateInput" class="flex-1 p-3 border-2 border-slate-50 rounded-xl text-xs outline-none"><button id="btnAddHoliday" class="bg-red-500 text-white px-4 py-3 rounded-xl text-xs font-black shadow-md">등록</button></div><div id="holidayListArea" class="flex flex-wrap gap-2"></div></section>
                <section class="mb-8 p-4 bg-white rounded-2xl border"><h4 class="font-black text-sm mb-3 text-slate-800">🚫 블랙리스트 관리</h4><div class="flex gap-2 mb-3"><input type="email" id="blackEmailInput" placeholder="이메일" class="flex-1 p-3 border-2 border-slate-50 rounded-xl text-xs outline-none"><button id="btnAddBlack" class="bg-slate-900 text-white px-4 py-3 rounded-xl text-xs font-black shadow-md">차단</button></div><div id="blackListArea" class="space-y-1"></div></section>
                <section><h4 class="font-black text-sm mb-3 text-indigo-600">📝 전체 예약 현황</h4><div id="adminList" class="space-y-2 text-xs bg-white p-3 rounded-2xl border max-h-60 overflow-y-auto"></div></section>
            </div>
        </div>

        <div id="authModal" class="modal-overlay">
            <div class="modal-content w-[90%] bg-white max-sm p-8 rounded-[30px] shadow-2xl text-center"><h3 class="font-black text-xl mb-6">마을학교 로그인</h3><div class="space-y-3 mb-6"><input type="email" id="authEmail" placeholder="이메일" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none"><input type="password" id="authPw" placeholder="비밀번호" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none"></div><div class="flex gap-2"><button id="btnSignUp" class="flex-1 py-3 border-2 border-emerald-100 text-emerald-600 font-bold rounded-xl text-sm">회원가입</button><button id="btnLoginEmail" class="flex-1 py-3 bg-emerald-600 text-white font-black rounded-xl text-sm">로그인</button></div></div>
        </div>
    </div>
    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAILS = ["442qkrrk@gmail.com", "nyamachoma@naver.com"];
        const isAdmin = (email) => ADMIN_EMAILS.includes(email);

        let currentDay = "";
        let holidayList = [], blackList = [], allReservations = [];

        function initTimeSlots() {
            const select = document.getElementById('modalTime'); select.innerHTML = "";
            for (let h = 9; h <= 20; h++) { 
                ['00', '30'].forEach(m => { if(h===20 && m==='30') return; const t = `${String(h).padStart(2, '0')}:${m}`; select.add(new Option(t, t)); }); 
            }
        }
        initTimeSlots();

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        function checkConflict(room, date, shortTime) {
            const selectedTime = new Date(`${date}T${shortTime}:00`);
            return allReservations.some(r => {
                if (r.date !== date || r.room !== room) return false;
                const reservedTime = new Date(`${r.date}T${r.shortTime}:00`);
                const diff = Math.abs(selectedTime - reservedTime) / (1000 * 60 * 60);
                return diff < 2;
            });
        }

        function checkReservedSlots() {
            const room = document.getElementById('modalRoom').value;
            Array.from(document.getElementById('modalTime').options).forEach(opt => {
                const isConflicted = checkConflict(room, currentDay, opt.value);
                opt.disabled = isConflicted;
                opt.text = isConflicted ? `${opt.value} (예약불가-2H)` : opt.value;
            });
            const select = document.getElementById('modalTime');
            if (select.selectedOptions[0]?.disabled) {
                const first = Array.from(select.options).find(o => !o.disabled);
                if (first) select.value = first.value;
            }
        }

        async function openBookingModal(date) {
            if (!auth.currentUser) { document.getElementById('authModal').style.display='flex'; return; }
            const d = new Date(date);
            currentDay = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (holidayList.includes(currentDay)) { alert("오늘은 휴관일입니다."); return; }
            
            document.getElementById('agreeRules').checked = false;
            const b = document.getElementById('btnConfirm');
            b.disabled = true;
            b.classList.remove('bg-emerald-600'); b.classList.add('bg-slate-200');

            document.getElementById('modalDateDisplay').innerText = `${currentDay} 예약`;
            document.getElementById('bookingModal').style.display = 'flex';
            checkReservedSlots();
        }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'ko',
            allDaySlot: false,
            navLinks: true,
            slotMinTime: '09:00:00', slotMaxTime: '21:00:00',
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek,dayView' },
            buttonText: { today: '오늘', month: '월', week: '주' },
            navLinkDayClick: function(date) { openBookingModal(date); }, // 주/월 보기 상단 날짜 클릭 대응
            customButtons: { dayView: { text: '토', click: function() { 
                const current = calendar.getDate(); const sat = new Date(current); sat.setDate(current.getDate() + (6 - current.getDay())); 
                calendar.changeView('timeGridDay', sat); 
            } } },
            dayCellClassNames: (arg) => {
                const dStr = `${arg.date.getFullYear()}-${String(arg.date.getMonth() + 1).padStart(2, '0')}-${String(arg.date.getDate()).padStart(2, '0')}`;
                return holidayList.includes(dStr) ? ['holiday-cell'] : [];
            },
            dateClick: (info) => openBookingModal(info.date), // 빈 슬롯 클릭 대응
            eventClick: async (info) => { if (confirm('삭제하시겠습니까?')) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("삭제됨"); } },
            eventContent: (arg) => {
                const nick = (arg.event.extendedProps.user || "").split('@')[0];
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band"; else if(arg.event.title.includes("제빵")) cls = "bg-bread"; 
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${arg.event.title}</div><div class="opacity-70">[${nick}]</div></div>` };
            }
        });

        const updateAdminUI = () => {
            const list = document.getElementById('adminList'); list.innerHTML = allReservations.length === 0 ? "예약 없음" : "";
            [...allReservations].sort((a,b) => b.time.localeCompare(a.time)).forEach(d => {
                const div = document.createElement('div'); div.className = "flex justify-between items-center p-2 border-b";
                div.innerHTML = `<div><b>${d.date}</b> ${d.shortTime} [${d.room}] - ${d.user.split('@')[0]}</div><button onclick="deleteBooking('${d.id}')" class="text-red-500 font-bold">삭제</button>`;
                list.appendChild(div);
            });
            const hArea = document.getElementById('holidayListArea'); hArea.innerHTML = "";
            holidayList.forEach((date) => {
                const div = document.createElement('div'); div.className = "bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px] flex items-center gap-1 font-bold";
                div.innerHTML = `${date}<button onclick="removeHolidayByDate('${date}')">×</button>`;
                hArea.appendChild(div);
            });
            const bArea = document.getElementById('blackListArea'); bArea.innerHTML = "";
            blackList.forEach(email => {
                const div = document.createElement('div'); div.className = "flex justify-between text-xs p-2 bg-slate-100 rounded-lg";
                div.innerHTML = `<span>${email}</span><button onclick="removeBlackByEmail('${email}')" class="text-red-500 font-bold">해제</button>`;
                bArea.appendChild(div);
            });
        };

        window.deleteBooking = async (id) => { if(confirm('삭제?')) { await deleteDoc(doc(db, "reservations", id)); }};
        window.removeHolidayByDate = async (date) => { 
            const snap = await getDocs(collection(db, "holidays"));
            snap.forEach(async (s) => { if(s.data().date === date) await deleteDoc(doc(db, "holidays", s.id)); });
        };
        window.removeBlackByEmail = async (email) => {
            const snap = await getDocs(collection(db, "blacklist"));
            snap.forEach(async (s) => { if(s.data().email === email) await deleteDoc(doc(db, "blacklist", s.id)); });
        };

        document.getElementById('modalRoom').onchange = () => checkReservedSlots();
        document.getElementById('btnAddHoliday').onclick = async () => { const date = document.getElementById('holidayDateInput').value; if(date) await addDoc(collection(db, "holidays"), { date }); };
        document.getElementById('btnAddBlack').onclick = async () => { const email = document.getElementById('blackEmailInput').value; if(email) await addDoc(collection(db, "blacklist"), { email }); };

        document.getElementById('btnConfirm').onclick = async () => {
            if(blackList.includes(auth.currentUser.email)) return alert("차단된 사용자입니다.");
            const room = document.getElementById('modalRoom').value, shortTime = document.getElementById('modalTime').value;
            if(checkConflict(room, currentDay, shortTime)) return alert("2시간 이내에 다른 예약이 있습니다.");
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, date: currentDay, time: `${currentDay}T${shortTime}`, shortTime });
            document.getElementById('bookingModal').style.display = 'none'; showToast("예약 완료!");
        };

        document.getElementById('btnAdminOpen').onclick = () => { updateAdminUI(); document.getElementById('adminModal').style.display = 'flex'; };
        document.getElementById('btnCloseBooking').onclick = () => document.getElementById('bookingModal').style.display = 'none';
        document.getElementById('btnCloseAdmin').onclick = () => document.getElementById('adminModal').style.display = 'none';
        document.getElementById('btnLoginEmail').onclick = () => {
            const e = document.getElementById('authEmail').value, p = document.getElementById('authPw').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("로그인 실패"));
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        document.getElementById('agreeRules').onchange = (e) => {
            const b = document.getElementById('btnConfirm'); b.disabled = !e.target.checked;
            if(e.target.checked) { b.classList.add('bg-emerald-600'); b.classList.remove('bg-slate-200'); }
            else { b.classList.remove('bg-emerald-600'); b.classList.add('bg-slate-200'); }
        };

        onSnapshot(collection(db, "holidays"), (snap) => { holidayList = snap.docs.map(doc => doc.data().date); calendar.render(); updateAdminUI(); });
        onSnapshot(collection(db, "blacklist"), (snap) => { blackList = snap.docs.map(doc => doc.data().email); updateAdminUI(); });
        onSnapshot(collection(db, "reservations"), (snap) => {
            allReservations = snap.docs.map(s => ({ id: s.id, ...s.data() }));
            const evs = allReservations.map(d => ({ id: d.id, title: d.room, start: d.time, extendedProps: { ...d } }));
            calendar.removeAllEvents(); calendar.addEventSource(evs); updateAdminUI();
        });
        onAuthStateChanged(auth, (u) => {
            document.getElementById('authModal').style.display = u ? 'none' : 'flex';
            document.getElementById('loginInfo').classList.toggle('hidden', !u);
            if(u && isAdmin(u.email)) document.getElementById('btnAdminOpen').classList.remove('hidden');
            if(u) document.getElementById('userNick').innerText = u.email.split('@')[0] + "님";
        });

        calendar.render();
    </script>
</body>
</html>
