<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        
        /* [v6.3] 모바일 잘림 방지 스타일 */
        #calendar {
            max-width: 100%;
            margin: 0 auto;
            font-size: 12px; /* 모바일에서 기본 글자 크기 축소 */
        }

        /* 캘린더 헤더(월 표시) 크기 조정 */
        .fc-toolbar {
            flex-direction: row !important;
            gap: 5px;
            margin-bottom: 1rem !important;
        }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900; }
        .fc-button { padding: 4px 8px !important; font-size: 12px !important; }

        /* 팝업 모달 최적화 */
        #bookingModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 이벤트 칩 모바일 대응 */
        .event-chip {
            font-size: 9px !important;
            padding: 1px 3px !important;
            margin: 1px 0 !important;
            border-radius: 3px;
            line-height: 1.2;
        }

        @media (min-width: 768px) {
            #calendar { font-size: 15px; }
            .fc-toolbar-title { font-size: 1.8rem !important; }
            .event-chip { font-size: 11px !important; }
        }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center py-4 px-2">
            <h1 class="text-xl md:text-2xl font-black text-emerald-700">무계마을학교 🏫</h1>
            <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
        </header>

        <div id="calendar" class="bg-white p-2 md:p-4 rounded-2xl shadow-sm"></div>

        <div id="bookingModal">
            <div class="modal-content">
                <div class="bg-emerald-600 p-5 text-center text-white">
                    <h3 class="font-black text-lg">📝 예약하기</h3>
                    <p id="modalDateDisplay" class="text-xs opacity-90"></p>
                </div>
                <div class="p-6 space-y-4">
                    <select id="modalTime" class="w-full p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50"></select>
                    <select id="modalRoom" class="w-full p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                    <div class="flex gap-2 pt-2">
                        <button id="btnCancel" class="flex-1 py-4 text-slate-400 font-bold">닫기</button>
                        <button id="btnConfirm" class="flex-2 py-4 bg-emerald-600 text-white font-black rounded-xl w-full shadow-lg">예약 완료</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 시간 리스트 생성
        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let currentDay = "";
        const modal = document.getElementById('bookingModal');

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto', // [v6.3 핵심] 높이 자동 조절로 잘림 방지
            aspectRatio: 1.35,
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            dateClick: function(info) {
                if (!auth.currentUser) return alert("로그인 후 이용 가능합니다!");
                currentDay = info.dateStr;
                document.getElementById('modalDateDisplay').innerText = currentDay + " 예약";
                modal.style.display = 'flex';
            },
            eventContent: function(arg) {
                return { html: `<div class="event-chip bg-emerald-500 text-white truncate">${arg.event.extendedProps.shortTime} ${arg.event.title}</div>` };
            },
            eventClick: async function(info) {
                if (confirm('삭제하시겠습니까?')) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => { if (!user) document.getElementById('btnLogout').style.display='none'; });

        document.getElementById('btnCancel').onclick = () => modal.style.display = 'none';
        document.getElementById('btnConfirm').onclick = async () => {
            await addDoc(collection(db, "reservations"), {
                user: auth.currentUser.email,
                room: document.getElementById('modalRoom').value,
                time: `${currentDay}T${modalTime.value}`,
                shortTime: modalTime.value
            });
            modal.style.display = 'none';
            alert("✅ 예약 성공!");
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });
    </script>
</body>
</html>
