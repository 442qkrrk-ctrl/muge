<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 예약시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fdfbf7; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        #bookingSection, #userInfo, #adminUserList { display: none; }
        
        .fc { background: white; padding: 5px; border-radius: 1.25rem; border: 1px solid #e2e8f0; height: auto !important; min-height: 550px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        /* [v5.2] 반응형 타이틀 설정 (모바일 기본 2줄) */
        .fc-toolbar-title { 
            display: flex !important; flex-direction: column !important; align-items: center !important; 
            line-height: 1.1 !important; font-size: 0.85rem !important; font-weight: 800; color: #065f46; 
        }
        .fc-toolbar-title::after {
            content: attr(data-month); font-size: 1.25rem !important; display: block; margin-top: 2px;
        }

        /* [v5.2] PC(768px 이상)에서는 다시 1줄로 변경 */
        @media (min-width: 768px) {
            .max-w-md { max-width: 1100px !important; }
            .fc-toolbar-title { 
                flex-direction: row !important; gap: 8px; font-size: 2rem !important; 
            }
            .fc-toolbar-title::after {
                content: attr(data-month); font-size: 2rem !important; margin-top: 0;
            }
            .fc .fc-col-header-cell-cushion { font-size: 1.1rem !important; }
            #btnSave { font-size: 18px !important; padding: 20px !important; }
        }

        /* 공통 헤더/버튼 스타일 */
        .fc .fc-col-header-cell-cushion { font-size: 0.8rem !important; font-weight: 600; color: #475569; padding: 4px 0 !important; }
        .fc .fc-button-group > .fc-prev-button, .fc .fc-button-group > .fc-next-button { padding: 4px 6px !important; font-size: 0.75rem !important; }
        .fc-today-button { padding: 4px 10px !important; font-size: 0.8rem !important; font-weight: 700 !important; }
        
        .month-event-box { display: flex; flex-direction: column; width: 100%; padding: 2px 1px; line-height: 1.1; }
        .month-time { font-size: 8px; color: #000 !important; font-weight: 900; opacity: 0.7; }
        .month-room { font-size: 10px; font-weight: 800; color: #000 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .input-row { display: flex; gap: 4px; align-items: center; }
        .input-row > * { flex: 1; min-width: 0; font-size: 13px !important; padding: 10px 4px !important; border-radius: 8px !important; border: 1px solid #e2e8f0; outline: none; }
        .fc-button-primary { background-color: #065f46 !important; border-color: #065f46 !important; }
        button:active { scale: 0.96; transition: 0.1s; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-md mx-auto px-3 pt-6 transition-all">
        <header class="flex justify-between items-center mb-5 px-1">
            <h1 class="text-xl md:text-3xl font-black text-emerald-700">무계행복마을학교</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-[9px] md:text-sm font-bold block text-slate-400"></span>
                <button id="btnLogout" class="text-[9px] md:text-sm text-red-400 font-bold">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border mb-4">
            <div class="flex flex-col md:flex-row gap-2 mb-2">
                <input type="email" id="emailInput" placeholder="이메일" class="flex-1 px-3 py-2 md:py-4 rounded-lg border outline-none text-sm">
                <input type="password" id="passwordInput" placeholder="비번" class="flex-1 px-3 py-2 md:py-4 rounded-lg border outline-none text-sm">
            </div>
            <div class="flex gap-2">
                <button id="btnLogin" class="flex-1 bg-emerald-600 text-white font-bold py-2 md:py-4 rounded-lg text-sm">로그인</button>
                <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-500 py-2 md:py-4 rounded-lg text-sm">가입</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-4 md:p-8 rounded-2xl shadow-md border-l-4 border-l-emerald-500 mb-4 transition-all">
            <div class="input-row mb-3 md:mb-5">
                <select id="roomName" class="border bg-emerald-50 font-bold outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="border outline-none">
                <select id="bookTimeSelect" class="border outline-none"></select>
            </div>
            <button id="btnSave" class="w-full bg-slate-800 text-white font-black py-3 md:py-5 rounded-xl shadow-lg text-sm md:text-lg">예약 확정하기</button>
        </section>

        <div id="calendar"></div>

        <div id="adminUserList" class="mt-8 bg-white p-5 rounded-2xl shadow-sm border border-orange-200">
            <h3 class="font-black text-orange-600 mb-3 flex items-center gap-2 text-sm">📢 실시간 가입자 명단</h3>
            <ul id="userUl" class="text-[11px] md:text-sm space-y-2 divide-y divide-orange-50"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            buttonText: { today: '오늘', month: '월', week: '주' },
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            dayHeaderFormat: { month: 'numeric', day: 'numeric', weekday: 'short' },
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            displayEventTime: false,
            // [v5.2] 타이틀 분리 로직 (반응형 대응)
            datesSet: function() {
                const titleEl = document.querySelector('.fc-toolbar-title');
                if (titleEl) {
                    const parts = calendar.view.title.split(' ');
                    if(parts.length >= 2) {
                        titleEl.innerText = parts[0]; 
                        titleEl.setAttribute('data-month', parts[1]);
                    }
                }
            },
            eventContent: function(arg) {
                const room = arg.event.title;
                const timeStr = arg.event.extendedProps.shortTime;
                if (arg.view.type === 'dayGridMonth') {
                    return { html: `<div class="month-event-box"><span class="month-time">${timeStr}</span><span class="month-room">${room}</span></div>` };
                } else {
                    return { html: `<div class="p-1"><b class="text-[10px] md:text-sm block text-white">${room}</b></div>` };
                }
            },
            eventClick: async function(info) {
                if (confirm(`예약을 삭제하시겠습니까?`)) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        onAuthStateChanged(auth, async (user) => {
            const ui = { auth: document.getElementById('authForm'), info: document.getElementById('userInfo'), book: document.getElementById('bookingSection'), admin: document.getElementById('adminUserList') };
            if (user) {
                ui.auth.style.display = 'none'; ui.info.style.display = 'block'; ui.book.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님";
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    ui.admin.style.display = 'block';
                    onSnapshot(collection(db, "users"), (snap) => {
                        const userUl = document.getElementById('userUl');
                        userUl.innerHTML = "";
                        snap.forEach(doc => {
                            const d = doc.data();
                            const li = document.createElement('li');
                            li.className = "flex justify-between py-2 text-slate-600";
                            li.innerHTML = `<span>👤 ${d.email}</span><span class="text-[9px] text-slate-400">${d.joinedAt?.split('T')[0] || '이전가입'}</span>`;
                            userUl.appendChild(li);
                        });
                    });
                }
            } else { ui.auth.style.display = 'block'; ui.info.style.display = 'none'; ui.book.style.display = 'none'; ui.admin.style.display = 'none'; }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert("로그인 실패!"));
        document.getElementById('btnSignup').onclick = async () => {
            try {
                const u = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                await setDoc(doc(db, "users", u.user.uid), { email: emailInput.value, isAdmin: false, joinedAt: new Date().toISOString() });
                alert("가입 성공!");
            } catch(e) { alert(e.message); }
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTimeSelect').value;
            if(!date) return alert("날짜 선택!");
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time: `${date}T${time}`, shortTime: time });
            const checklist = `[퇴실 체크리스트]\n1. 🔗 악기/도구/케이블 정리\n2. 🗑️ 쓰레기 비우기\n3. 🔥 전열기구 확인\n4. ❄️ 에어컨 끄기\n5. 🔌 전자제품 끄기\n6. ⚡ 멀티탭 끄기\n7. 💡 모든 불 끄기\n8. 🔐 문 잠그고 퇴실`;
            alert("✅ 예약 완료!\n\n" + checklist);
            if (confirm("본인에게 확인 메일을 보낼까요?")) {
                const subject = encodeURIComponent(`[무계] 예약 안내 (${room})`);
                const body = encodeURIComponent(`안녕하세요. 예약 일정을 확인하세요.\n장소: ${room}\n일시: ${date} ${time}\n\n${checklist}`);
                window.location.href = `mailto:?to=${auth.currentUser.email}&subject=${subject}&body=${body}`;
            }
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, backgroundColor: getRoomColor(d.room), extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#10b981", "제빵실": "#f59e0b", "공작실": "#6366f1", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room] || "#64748b";
        }
    </script>
</body>
</html>
