<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 예약시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fdfbf7; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        #bookingSection, #adminPanel, #userInfo { display: none; }
        
        /* [공통] 캘린더 기본 스타일 */
        .fc { background: white; padding: 5px; border-radius: 1.25rem; border: 1px solid #e2e8f0; height: auto !important; min-height: 550px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        /* [v4.6 핵심: 이동 버튼(prev, next) 크기 축소] */
        .fc .fc-button-group > .fc-prev-button,
        .fc .fc-button-group > .fc-next-button {
            padding: 4px 8px !important; /* 내부 여백 축소 */
            font-size: 0.8rem !important; /* 화살표 크기 축소 */
        }
        
        /* 시간 축 글자 크기 축소 */
        .fc .fc-timegrid-slot-label-cushion, 
        .fc-timegrid-axis-cushion {
            font-size: 0.7rem !important; font-weight: 500; color: #64748b; 
        }

        /* [PC 반응형] 768px 이상 확대 로직 */
        @media (min-width: 768px) {
            .max-w-md { max-width: 1100px !important; }
            .fc-toolbar-title { font-size: 2.2rem !important; }
            .fc .fc-timegrid-slot-label-cushion { font-size: 1rem !important; }
            .month-time { font-size: 11px !important; }
            .month-room { font-size: 14px !important; }
            .input-row > * { font-size: 16px !important; padding: 15px !important; }
            #btnSave { font-size: 18px !important; padding: 20px !important; }
            .fc-col-header-cell-cushion { font-size: 1rem !important; }
            .fc .fc-button { font-size: 1rem !important; padding: 8px 16px !important; }
            /* PC에서는 이동버튼도 적절히 키움 */
            .fc .fc-button-group > .fc-prev-button,
            .fc .fc-button-group > .fc-next-button { padding: 8px 12px !important; font-size: 1rem !important; }
        }

        /* [모바일 타이틀] */
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 800; color: #065f46; margin: 0 5px !important; }

        /* [월 보기] 시간/장소 두 줄 배치 */
        .month-event-box { display: flex; flex-direction: column; width: 100%; padding: 2px 1px; line-height: 1.1; }
        .month-time { font-size: 8px; color: #000 !important; font-weight: 900; opacity: 0.7; }
        .month-room { font-size: 10px; font-weight: 800; color: #000 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* [예약바] 한 줄 배치 */
        .input-row { display: flex; gap: 4px; align-items: center; }
        .input-row > * { flex: 1; min-width: 0; font-size: 13px !important; padding: 10px 4px !important; border-radius: 8px !important; border: 1px solid #e2e8f0; outline: none; }
        
        /* 버튼 컬러 커스텀 */
        .fc-button-primary { background-color: #065f46 !important; border-color: #065f46 !important; }
        .fc-today-button { font-size: 0.85rem !important; padding: 4px 10px !important; } /* 오늘 버튼도 약간 조정 */
        button:active { scale: 0.96; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-md mx-auto px-3 pt-6 transition-all">
        <header class="flex justify-between items-center mb-5 px-1">
            <h1 class="text-xl md:text-3xl font-black text-emerald-700">무계행복마을학교</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-[9px] md:text-sm font-bold block text-slate-400"></span>
                <button id="btnLogout" class="text-[9px] md:text-sm text-red-400 font-bold">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border mb-4">
            <div class="flex flex-col md:flex-row gap-2 mb-2">
                <input type="email" id="emailInput" placeholder="이메일" class="flex-1 px-3 py-2 md:py-4 rounded-lg border text-sm md:text-base outline-none">
                <input type="password" id="passwordInput" placeholder="비번" class="flex-1 px-3 py-2 md:py-4 rounded-lg border text-sm md:text-base outline-none">
            </div>
            <div class="flex gap-2">
                <button id="btnLogin" class="flex-1 bg-emerald-600 text-white font-bold py-2 md:py-4 rounded-lg text-sm md:text-base">로그인</button>
                <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-500 py-2 md:py-4 rounded-lg text-sm md:text-base">가입</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-4 md:p-8 rounded-2xl shadow-md border-l-4 md:border-l-8 border-l-emerald-500 mb-4">
            <div class="input-row mb-3 md:mb-5">
                <select id="roomName" class="border bg-emerald-50 font-bold outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="border outline-none">
                <select id="bookTimeSelect" class="border outline-none"></select>
            </div>
            <button id="btnSave" class="w-full bg-slate-800 text-white font-black py-3 md:py-5 rounded-xl text-sm md:text-lg shadow-lg">예약 확정하기</button>
        </section>

        <div id="calendar"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            buttonText: { today: '오늘', month: '월', week: '주' },
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            slotLabelFormat: { hour: 'numeric', minute: '2-digit', omitZeroMinute: false, meridian: 'narrow' },
            titleFormat: { year: 'numeric', month: 'long' },
            aspectRatio: window.innerWidth < 768 ? 0.75 : 1.7,
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            displayEventTime: false,
            eventContent: function(arg) {
                const room = arg.event.title;
                const timeStr = arg.event.extendedProps.shortTime;
                if (arg.view.type === 'dayGridMonth') {
                    return { html: `<div class="month-event-box"><span class="month-time">${timeStr}</span><span class="month-room">${room}</span></div>` };
                } else {
                    return { html: `<div class="p-1"><b class="text-[10px] md:text-sm block text-white">${room}</b></div>` };
                }
            },
            eventClick: async function(info) {
                if (confirm(`예약을 삭제하시겠습니까?`)) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            const ui = { auth: document.getElementById('authForm'), info: document.getElementById('userInfo'), book: document.getElementById('bookingSection') };
            if (user) {
                ui.auth.style.display = 'none'; ui.info.style.display = 'block'; ui.book.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님";
            } else { ui.auth.style.display = 'block'; ui.info.style.display = 'none'; ui.book.style.display = 'none'; }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert(e.message));
        document.getElementById('btnSignup').onclick = async () => {
            const u = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            await setDoc(doc(db, "users", u.user.uid), { email: emailInput.value, isAdmin: false });
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTimeSelect').value;
            if(!date) return alert("날짜 선택!");
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time: `${date}T${time}`, shortTime: time });
            alert("예약 완료!");
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, backgroundColor: getRoomColor(d.room), extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#10b981", "제빵실": "#f59e0b", "공작실": "#6366f1", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room] || "#64748b";
        }
    </script>
</body>
</html>
