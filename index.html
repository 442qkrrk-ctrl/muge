<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.2.5)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        /* 캘린더 디자인 커스텀 */
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; padding: 15px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900 !important; color: #065f46; }
        .fc-button { padding: 6px 10px !important; font-size: 0.8rem !important; font-weight: 800 !important; border-radius: 10px !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        
        /* 주간 보기 상단 all-day 제거 시 여백 조정 */
        .fc-timegrid-axis-cbox { display: none; }
        
        .event-chip { font-size: 10px; padding: 4px; border-radius: 6px; color: white; font-weight: 700; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .bg-band { background-color: #10b981 !important; } .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; } .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }
        
        #calendar { background: white; border-radius: 20px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        #toast { visibility: hidden; min-width: 200px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; font-size: 13px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-4 px-1">
            <div>
                <h1 class="text-xl font-black text-emerald-900">무계행복마을학교</h1>
                <p class="text-[10px] font-bold text-emerald-600 tracking-tighter">시설 예약 관리 시스템 (v1.2.5)</p>
            </div>
            <div id="loginInfo" class="text-right hidden">
                <span id="userNick" class="text-[11px] font-black block text-slate-700"></span>
                <button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-white max-w-sm p-6 rounded-[30px] shadow-2xl">
                <h3 id="modalDateDisplay" class="font-black text-lg text-center mb-6 text-slate-800">예약 신청</h3>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-1">시간 선택</label>
                        <select id="modalTime" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400"></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-1">시설 선택</label>
                        <select id="modalRoom" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6 shadow-inner">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="agreeRules" class="w-5 h-5 accent-emerald-500">
                        <span class="text-xs font-bold text-white">이용 수칙을 준수하겠습니다.</span>
                    </label>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('bookingModal').style.display='none'" class="flex-1 py-3 text-slate-400 font-bold">취소</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl transition-all">예약 확정</button>
                </div>
            </div>
        </div>

        <div id="authModal" class="modal-overlay" style="display: flex;">
            <div class="modal-content w-[90%] bg-white max-w-sm p-8 rounded-[30px] shadow-2xl text-center border-b-[8px] border-emerald-500">
                <h3 class="font-black text-xl mb-6 text-slate-800">마을학교 로그인</h3>
                <button id="btnGoogle" class="w-full py-3 mb-4 border-2 border-slate-100 rounded-xl font-bold flex justify-center items-center gap-2 hover:bg-slate-50"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">구글 로그인</button>
                <div class="text-[10px] text-slate-300 mb-4">또는 이메일 로그인</div>
                <input type="email" id="email" placeholder="이메일" class="w-full p-3 mb-2 bg-slate-50 rounded-xl outline-none text-sm font-bold">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full p-3 mb-6 bg-slate-50 rounded-xl outline-none text-sm font-bold">
                <button id="btnLogin" class="w-full py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg">로그인</button>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentDay = "";
        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) { ['00', '30'].forEach(m => { const hh = String(h).padStart(2, '0'); modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`)); }); }

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            selectable: true,
            allDaySlot: false, // 주간 보기에서 all-day 삭제 (핵심 수정 사항)
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek' },
            buttonText: { today: '오늘', month: '월', week: '주' },
            select: function(info) {
                if (!auth.currentUser) { document.getElementById('authModal').style.display='flex'; return; }
                currentDay = info.startStr.split('T')[0];
                const startTime = info.startStr.includes('T') ? info.startStr.split('T')[1].substring(0, 5) : "09:00";
                document.getElementById('modalDateDisplay').innerText = `${currentDay} 예약`;
                document.getElementById('modalTime').value = startTime;
                document.getElementById('agreeRules').checked = false;
                document.getElementById('btnConfirm').disabled = true;
                document.getElementById('btnConfirm').className = "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl";
                document.getElementById('bookingModal').style.display = 'flex';
                calendar.unselect();
            },
            eventContent: (arg) => {
                const nick = (arg.event.extendedProps.user || "").split('@')[0];
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band";
                else if(arg.event.title.includes("제빵")) cls = "bg-bread";
                else if(arg.event.title.includes("공작")) cls = "bg-work";
                else if(arg.event.title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${arg.event.title}</div><div style="font-size:7px; opacity:0.8;">[${nick}]</div></div>` };
            },
            eventClick: async (info) => {
                if (auth.currentUser && (auth.currentUser.email === info.event.extendedProps.user || auth.currentUser.email === "442qkrrk@gmail.com")) {
                    if (confirm(`[${info.event.title}] 예약을 취소하시겠습니까?`)) {
                        await deleteDoc(doc(db, "reservations", info.event.id));
                        showToast("✅ 삭제 완료");
                    }
                } else { showToast("본인 예약만 취소 가능합니다."); }
            }
        });

        onSnapshot(collection(db, "reservations"), (snap) => {
            const evs = [];
            snap.forEach(s => { const d = s.data(); evs.push({ id: s.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime, user: d.user } }); });
            calendar.removeAllEvents(); calendar.addEventSource(evs);
        });

        document.getElementById('btnConfirm').onclick = async () => {
            const room = document.getElementById('modalRoom').value;
            const time = `${currentDay}T${document.getElementById('modalTime').value}`;
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room: room, time: time, shortTime: document.getElementById('modalTime').value });
            document.getElementById('bookingModal').style.display = 'none';
            showToast("✅ 예약 완료");
        };

        document.getElementById('agreeRules').onchange = (e) => {
            const b = document.getElementById('btnConfirm');
            b.disabled = !e.target.checked;
            b.className = e.target.checked ? "flex-[2] py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg" : "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl";
        };

        onAuthStateChanged(auth, (u) => {
            document.getElementById('authModal').style.display = u ? 'none' : 'flex';
            document.getElementById('loginInfo').classList.toggle('hidden', !u);
            if(u) document.getElementById('userNick').innerText = u.email.split('@')[0] + "님";
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, email.value, pw.value);
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        calendar.render();
        window.addEventListener('resize', () => calendar.changeView(window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek'));
    </script>
</body>
</html>
