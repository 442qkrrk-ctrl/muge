<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* [v6.4] 모바일 강제 압축 레이아웃 */
        #calendar {
            max-width: 100% !important;
            margin: 0 auto;
        }

        /* 캘린더 내부 높이 강제 조정 */
        .fc .fc-view-harness { height: auto !important; min-height: 350px !important; }
        .fc .fc-daygrid-day-frame { min-height: 50px !important; } /* 칸 높이 축소 */
        .fc-scroller { overflow: hidden !important; } /* 스크롤바 제거 */

        /* 날짜 숫자 크기 조절 */
        .fc-daygrid-day-number { font-size: 11px !important; padding: 2px !important; }
        .fc-col-header-cell-cushion { font-size: 12px !important; padding: 5px 0 !important; }

        /* 이벤트 칩을 점(Dot)이나 아주 작은 바(Bar)로 변경 */
        .event-chip {
            font-size: 8px !important;
            padding: 0px 2px !important;
            margin: 1px 0 !important;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* 팝업 모달 하단 고정 (모바일에서 더 편리함) */
        @media (max-width: 768px) {
            #bookingModal { align-items: flex-end; padding: 0; }
            .modal-content { border-radius: 24px 24px 0 0; max-width: 100%; animation: slideUp 0.3s ease-out; }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            .fc-toolbar-title { font-size: 1rem !important; }
        }

        #bookingModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; }
    </style>
</head>
<body class="p-0 md:p-8">

    <div class="max-w-[1000px] mx-auto px-2">
        <header class="flex justify-between items-center py-4">
            <h1 class="text-xl font-black text-emerald-700">무계마을학교</h1>
            <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
        </header>

        <div id="calendar" class="bg-white rounded-xl shadow-sm border border-slate-100"></div>

        <div id="bookingModal">
            <div class="modal-content w-full bg-white">
                <div class="p-6 space-y-4">
                    <h3 id="modalDateDisplay" class="font-black text-lg text-emerald-800">날짜 선택</h3>
                    <div class="flex gap-2">
                        <select id="modalTime" class="flex-1 p-4 border rounded-xl font-bold bg-slate-50"></select>
                        <select id="modalRoom" class="flex-1 p-4 border rounded-xl font-bold bg-slate-50">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                    <div class="flex gap-3">
                        <button id="btnCancel" class="flex-1 py-4 text-slate-400 font-bold">닫기</button>
                        <button id="btnConfirm" class="flex-[2] py-4 bg-emerald-600 text-white font-black rounded-xl">예약 확정</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let currentDay = "";
        const modal = document.getElementById('bookingModal');

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto', 
            contentHeight: 'auto',
            expandRows: false, // 행이 억지로 늘어나는 것 방지
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            dateClick: function(info) {
                if (!auth.currentUser) return alert("로그인 해주세요!");
                currentDay = info.dateStr;
                document.getElementById('modalDateDisplay').innerText = currentDay + " 예약";
                modal.style.display = 'flex';
            },
            eventContent: function(arg) {
                return { html: `<div class="event-chip bg-emerald-600 text-white">${arg.event.extendedProps.shortTime}</div>` };
            },
            eventClick: async function(info) {
                if (confirm('삭제할까요?')) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        document.getElementById('btnCancel').onclick = () => modal.style.display = 'none';
        document.getElementById('btnConfirm').onclick = async () => {
            await addDoc(collection(db, "reservations"), {
                user: auth.currentUser.email,
                room: document.getElementById('modalRoom').value,
                time: `${currentDay}T${modalTime.value}`,
                shortTime: modalTime.value
            });
            modal.style.display = 'none';
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);
        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });
    </script>
</body>
</html>
