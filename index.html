<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge 통합 시스템 v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #bookingSection, #adminPanel, #userInfo { display: none; }
        .fc { background: white; padding: 10px; border-radius: 1rem; border: 1px solid #e2e8f0; max-height: 700px; }
        .fc-event { cursor: pointer; transition: opacity 0.2s; }
        .fc-event:hover { opacity: 0.8; }
    </style>
</head>
<body class="min-h-screen py-10">

    <div class="max-w-4xl mx-auto px-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">🎸 Muge 통합 시스템 v3.0</h1>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div id="authForm" class="space-y-3">
                <input type="email" id="emailInput" placeholder="이메일 주소" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <div class="flex gap-2">
                    <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">로그인</button>
                    <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg hover:bg-slate-200 transition">회원가입</button>
                </div>
            </div>
            <div id="userInfo" class="flex items-center justify-between">
                <div>
                    <div id="userBadgeArea" class="mb-1 flex gap-1 text-[10px]"></div>
                    <p id="userDisplay" class="font-bold text-slate-800"></p>
                </div>
                <button id="btnLogout" class="text-sm text-red-500 hover:font-bold transition">로그아웃</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 border-l-4 border-l-blue-500">
            <h2 class="text-lg font-semibold mb-2 text-slate-700">📅 새 예약 만들기</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <select id="roomName" class="px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <select id="bookTimeSelect" class="px-4 py-2 rounded-lg border border-slate-300 outline-none"></select>
            </div>
            <button id="btnSave" class="w-full mt-4 bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">예약 확정</button>
        </section>

        <section class="mb-10">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">🗓️ 예약 현황 (클릭 시 관리)</h2>
            <div id="calendar"></div>
        </section>

        <section id="adminPanel" class="bg-white p-6 rounded-2xl shadow-sm border-2 border-orange-200 mb-6 bg-orange-50/50">
            <h2 class="text-lg font-semibold mb-4 text-orange-700 font-bold">👑 관리자용 회원 승인</h2>
            <div id="userList" class="space-y-2"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, getDocs, where, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        // 시간 옵션 (09:00~22:00)
        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 22; h++) {
            for (let m of ['00', '30']) {
                if (h === 22 && m === '30') continue;
                const hh = String(h).padStart(2, '0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${m}`; opt.textContent = `${hh}:${m}`;
                timeSelect.appendChild(opt);
            }
        }

        // 캘린더
        let calendar;
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            locale: 'ko',
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            events: [],
            eventClick: async function(info) {
                const eventId = info.event.id;
                const ownerEmail = info.event.extendedProps.user;
                const isAdmin = currentUserData?.isAdmin === true;
                const isOwner = auth.currentUser?.email === ownerEmail;

                // [핵심 로직] 본인이거나 관리자일 때만 삭제/수정 가능
                if (isOwner || isAdmin) {
                    if (confirm(`[${info.event.title}]\n이 예약을 취소(삭제)하시겠습니까?`)) {
                        try {
                            await deleteDoc(doc(db, "reservations", eventId));
                            alert("삭제되었습니다.");
                        } catch(e) { alert("삭제 실패: " + e.message); }
                    }
                } else {
                    alert("본인의 예약만 관리할 수 있습니다.");
                }
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            const authForm = document.getElementById('authForm'), userInfo = document.getElementById('userInfo');
            const bookingSection = document.getElementById('bookingSection'), adminPanel = document.getElementById('adminPanel');
            if (user) {
                authForm.style.display = 'none'; userInfo.style.display = 'flex'; bookingSection.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if(snap.exists()) {
                        currentUserData = snap.data();
                        const bArea = document.getElementById('userBadgeArea');
                        bArea.innerHTML = `<span class="bg-blue-100 p-1 rounded">${currentUserData.isAdmin ? '전체관리자' : '일반회원'}</span>`;
                        if(currentUserData.isAdmin) { adminPanel.style.display = 'block'; loadUserList(); }
                    }
                });
            } else {
                authForm.style.display = 'block'; userInfo.style.display = 'none'; bookingSection.style.display = 'none'; adminPanel.style.display = 'none';
            }
        });

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTimeSelect').value;
            if(!date) return alert("날짜 선택 필수");
            const selectedTimestamp = new Date(`${date}T${time}`).getTime();
            try {
                const q = query(collection(db, "reservations"), where("room", "==", room));
                const snap = await getDocs(q);
                let isConflict = false;
                snap.forEach(d => { if (Math.abs(selectedTimestamp - new Date(d.data().time).getTime()) < 2 * 60 * 60 * 1000) isConflict = true; });
                if (isConflict) return alert("❌ 해당 시설에 2시간 이내 예약이 이미 존재합니다.");
                await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time: `${date}T${time}` });
                alert("✅ 예약 완료!");
            } catch (e) { alert(e.message); }
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({
                    id: doc.id, // 삭제를 위해 문서 ID 저장
                    title: `${d.room} (${d.user.split('@')[0]})`,
                    start: d.time,
                    backgroundColor: getRoomColor(d.room),
                    borderColor: 'transparent',
                    extendedProps: { user: d.user }
                });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#ef4444", "제빵실": "#f59e0b", "공작실": "#10b981", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room] || "#64748b";
        }

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        document.getElementById('btnSignup').onclick = async () => {
            const u = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            await setDoc(doc(db, "users", u.user.uid), { email: emailInput.value, approved: false, isAdmin: false });
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        function loadUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList'); list.innerHTML = "";
                snap.forEach(uDoc => {
                    if(uDoc.data().email === auth.currentUser.email) return;
                    const d = uDoc.data();
                    list.innerHTML += `<div class="flex justify-between items-center p-2 border-b text-xs">
                        <span>${d.email} (${d.approved ? '승인' : '대기'})</span>
                        <button onclick="window.toggleUser('${uDoc.id}', ${d.approved})" class="bg-slate-200 px-2 py-1 rounded">변경</button>
                    </div>`;
                });
            });
        }
        window.toggleUser = (id, current) => updateDoc(doc(db, 'users', id), { approved: !current });
    </script>
</body>
</html>
