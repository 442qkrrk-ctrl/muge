<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.1.8)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; padding: 12px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900; color: #1e293b; }
        .fc-button { padding: 6px 10px !important; font-size: 0.8rem !important; font-weight: 800 !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .fc-timegrid-slot { height: 70px !important; } 
        .fc-day-header a { text-decoration: none !important; color: #475569 !important; }
        
        .event-chip { font-size: 10px; padding: 4px; border-radius: 4px; color: white; font-weight: 700; line-height: 1.2; }
        .bg-band { background-color: #10b981 !important; }
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; }
        .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }

        #calendar { background: white; border-radius: 16px; padding: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); z-index: 9999; justify-content: center; align-items: center; }
        @media (max-width: 768px) { .modal-overlay { align-items: flex-end; } .modal-content { border-radius: 24px 24px 0 0 !important; } }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1100px] mx-auto">
        <header class="flex justify-between items-center py-4 px-2">
            <h1 class="text-xl font-black text-emerald-800 tracking-tight">무계행복마을학교 예약</h1>
            <div class="flex gap-2 items-center">
                <button id="btnAdminOpen" class="hidden text-[10px] bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-full font-black">🛠 관리자 모드</button>
                <span id="userStatus" class="text-[10px] font-bold text-slate-400"></span>
                <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="authModal" class="modal-overlay" style="display: flex;">
            <div class="modal-content w-full bg-white max-w-md p-8 rounded-3xl shadow-2xl text-center mx-4 border-b-8 border-emerald-600">
                <h3 class="font-black text-2xl mb-2 text-emerald-900">반가워요!</h3>
                <p class="text-sm text-slate-400 mb-8">시설 예약을 위해 로그인해 주세요.</p>
                <button id="btnGoogle" class="w-full py-4 mb-4 bg-white border-2 flex items-center justify-center gap-3 rounded-2xl font-bold hover:bg-slate-50 transition-all shadow-sm"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> 구글 로그인</button>
                <div class="flex items-center my-4 opacity-30"><hr class="flex-grow"> <span class="mx-3 text-xs">또는 이메일</span> <hr class="flex-grow"></div>
                <input type="email" id="email" placeholder="이메일 주소" class="w-full p-4 mb-3 border-2 rounded-2xl bg-slate-50 outline-none focus:border-emerald-500 transition-all">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full p-4 mb-6 border-2 rounded-2xl bg-slate-50 outline-none focus:border-emerald-500 transition-all">
                <div class="flex gap-2">
                    <button id="btnLogin" class="flex-1 py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all">로그인</button>
                    <button id="btnJoin" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl active:scale-95 transition-all">회원가입</button>
                </div>
            </div>
        </div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-md p-6 rounded-3xl shadow-2xl mx-4">
                <h3 id="modalDateDisplay" class="font-black text-lg mb-4 text-center text-emerald-900">시설 예약 설정</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <select id="modalTime" class="p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50 text-sm focus:border-emerald-500 outline-none"></select>
                    <select id="modalRoom" class="p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50 text-sm focus:border-emerald-500 outline-none">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                </div>

                <div class="bg-amber-50 p-4 rounded-2xl mb-6 border border-amber-100 shadow-inner text-center">
                    <h4 class="text-xs font-black text-amber-800 mb-2">⚠️ 이용 수칙 (필수 확인)</h4>
                    <div class="text-[11px] text-amber-900 space-y-1 mb-4 opacity-80">
                        <p>퇴실 전 모든 전등/냉난방기 끄기</p>
                        <p>사용한 비품 및 쓰레기 정리 완료</p>
                    </div>
                    <label class="flex items-center justify-center gap-2 cursor-pointer pt-3 border-t border-amber-200">
                        <input type="checkbox" id="agreeRules" class="w-4 h-4 accent-emerald-600">
                        <span class="text-xs font-bold text-emerald-900">약속합니다</span>
                    </label>
                </div>

                <div class="flex gap-2">
                    <button id="closeBooking" class="flex-1 py-4 text-slate-400 font-bold">취소</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-4 bg-slate-200 text-white font-black rounded-xl cursor-not-allowed transition-all shadow-md">예약 확정</button>
                </div>
            </div>
        </div>

        <div id="successModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-md p-8 rounded-3xl shadow-2xl text-center mx-4">
                <div class="text-5xl mb-4">🎉</div>
                <h3 class="font-black text-2xl text-emerald-700">예약 완료!</h3>
                <p id="successRoomInfo" class="text-slate-500 font-bold mt-2 mb-6"></p>
                <button id="closeSuccess" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg">확인했습니다</button>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-full bg-slate-100 max-w-2xl p-6 rounded-3xl shadow-2xl mx-4 max-h-[90vh] overflow-y-auto border-t-8 border-indigo-600">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-xl text-indigo-900">운영자 대시보드</h3>
                    <button id="closeAdmin" class="text-slate-400 font-bold text-2xl">&times;</button>
                </div>
                
                <div class="mb-8">
                    <h4 class="font-bold text-xs mb-3 text-slate-500 uppercase tracking-widest flex items-center gap-2">📅 전체 예약 내역 <span id="adminTotalCount" class="bg-indigo-500 text-white px-2 py-0.5 rounded text-[10px]">0</span></h4>
                    <div id="adminReservationList" class="space-y-2 max-h-64 overflow-y-auto pr-2"></div>
                </div>

                <div>
                    <h4 class="font-bold text-xs mb-3 text-slate-500 uppercase tracking-widest">🚫 블랙리스트 관리</h4>
                    <div class="flex gap-2 mb-4">
                        <input type="email" id="blackInput" placeholder="차단할 이메일 주소" class="flex-1 p-3 border-2 rounded-xl text-sm outline-none focus:border-indigo-500 transition-all">
                        <button id="btnBlackAdd" class="px-5 bg-indigo-600 text-white font-black rounded-xl text-sm shadow-md active:scale-95 transition-all">등록</button>
                    </div>
                    <div id="adminBlackList" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "442qkrrk@gmail.com";
        const authModal = document.getElementById('authModal');
        const bookingModal = document.getElementById('bookingModal');
        const adminModal = document.getElementById('adminModal');
        const agreeRules = document.getElementById('agreeRules');
        const btnConfirm = document.getElementById('btnConfirm');
        const btnAdminOpen = document.getElementById('btnAdminOpen');

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) { ['00', '30'].forEach(m => { const hh = String(h).padStart(2, '0'); modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`)); }); }

        let currentDay = "";

        onAuthStateChanged(auth, (u) => {
            if (u) { 
                authModal.style.display = 'none'; 
                document.getElementById('userStatus').innerText = (u.displayName || u.email.split('@')[0]) + "님";
                if (u.email === ADMIN_EMAIL) btnAdminOpen.classList.remove('hidden');
            } else { 
                authModal.style.display = 'flex'; 
                btnAdminOpen.classList.add('hidden');
                bookingModal.style.display = 'none';
            }
        });

        agreeRules.addEventListener('change', (e) => {
            btnConfirm.disabled = !e.target.checked;
            if (e.target.checked) { btnConfirm.classList.replace('bg-slate-200', 'bg-emerald-600'); btnConfirm.classList.remove('cursor-not-allowed'); }
            else { btnConfirm.classList.replace('bg-emerald-600', 'bg-slate-200'); btnConfirm.classList.add('cursor-not-allowed'); }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, email.value, pw.value).catch(e => showToast("로그인 정보 확인"));
        document.getElementById('btnJoin').onclick = () => createUserWithEmailAndPassword(auth, email.value, pw.value).catch(e => showToast("이미 가입된 이메일이거나 형식이 맞지 않습니다."));
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        document.getElementById('btnAdminOpen').onclick = () => { adminModal.style.display = 'flex'; loadAdminData(); };
        document.getElementById('closeAdmin').onclick = () => adminModal.style.display = 'none';
        document.getElementById('closeSuccess').onclick = () => document.getElementById('successModal').style.display = 'none';
        document.getElementById('closeBooking').onclick = () => bookingModal.style.display = 'none';

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko', height: 'auto', slotMinTime: '09:00:00', slotMaxTime: '22:00:00',
            selectable: true, navLinks: true,
            buttonText: { today: '오늘', month: '월', week: '주' },
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek' },
            navLinkDayClick: (date) => { if (auth.currentUser) { currentDay = date.toLocaleDateString('en-CA'); openBookingModal(currentDay); } else { authModal.style.display = 'flex'; } },
            select: (info) => { if (auth.currentUser) { currentDay = info.startStr.split('T')[0]; if (info.startStr.includes('T')) modalTime.value = info.startStr.split('T')[1].substring(0, 5); openBookingModal(currentDay); calendar.unselect(); } else { authModal.style.display = 'flex'; } },
            eventContent: (arg) => {
                const title = arg.event.title;
                const nick = arg.event.extendedProps.user ? arg.event.extendedProps.user.split('@')[0] : "익명";
                let cls = "bg-multi";
                if(title.includes("밴드")) cls = "bg-band"; else if(title.includes("제빵")) cls = "bg-bread"; else if(title.includes("공작")) cls = "bg-work"; else if(title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${title}</div><div style="font-size: 8px; opacity: 0.8;">[${nick}]</div></div>` };
            },
            eventClick: async (info) => {
                if (!auth.currentUser) return;
                const owner = info.event.extendedProps.user;
                if (auth.currentUser.email !== owner && auth.currentUser.email !== ADMIN_EMAIL) { showToast("❌ 취소 권한 없음"); return; }
                if (confirm('예약을 취소하시겠습니까?')) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("✅ 취소 완료"); }
            }
        });
        calendar.render();

        function openBookingModal(day) {
            agreeRules.checked = false; btnConfirm.disabled = true;
            btnConfirm.classList.replace('bg-emerald-600', 'bg-slate-200'); btnConfirm.classList.add('cursor-not-allowed');
            document.getElementById('modalDateDisplay').innerText = day + " 예약";
            bookingModal.style.display = 'flex';
        }

        async function isBlacklisted(email) {
            const q = query(collection(db, "blacklist"), where("email", "==", email));
            const snap = await getDocs(q); return !snap.empty;
        }

        btnConfirm.onclick = async () => {
            const userEmail = auth.currentUser.email;
            if (await isBlacklisted(userEmail)) { showToast("🚫 이용이 금지된 계정입니다."); bookingModal.style.display = 'none'; return; }
            
            const room = document.getElementById('modalRoom').value;
            const fullTime = `${currentDay}T${modalTime.value}`;
            btnConfirm.disabled = true;
            try {
                const q = query(collection(db, "reservations"), where("room", "==", room));
                const snap = await getDocs(q);
                let overlap = false;
                snap.forEach(d => { if (d.data().time.startsWith(currentDay)) { if (Math.abs(new Date(d.data().time) - new Date(fullTime)) < 3600000) overlap = true; } });
                if (overlap) { showToast("⚠️ 같은 시간에 예약이 이미 존재합니다."); }
                else {
                    await addDoc(collection(db, "reservations"), { user: userEmail, room: room, time: fullTime, shortTime: modalTime.value });
                    bookingModal.style.display = 'none';
                    document.getElementById('successRoomInfo').innerText = `${currentDay} ${room}`;
                    document.getElementById('successModal').style.display = 'flex';
                }
            } catch (e) { showToast("서버 오류"); }
            btnConfirm.disabled = false;
        };

        function loadAdminData() {
            onSnapshot(collection(db, "reservations"), (snap) => {
                const list = document.getElementById('adminReservationList');
                document.getElementById('adminTotalCount').innerText = snap.size; list.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const item = document.createElement('div');
                    item.className = "bg-white p-3 rounded-xl border flex justify-between items-center text-xs shadow-sm mb-2";
                    item.innerHTML = `<div><div class="font-bold text-indigo-900">${d.time.replace('T', ' ')} [${d.room}]</div><div class="text-slate-400">${d.user}</div></div><button onclick="window.adminDeleteRes('${docSnap.id}')" class="text-red-500 font-bold hover:underline">취소</button>`;
                    list.appendChild(item);
                });
            });
            onSnapshot(collection(db, "blacklist"), (snap) => {
                const list = document.getElementById('adminBlackList'); list.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const item = document.createElement('div');
                    item.className = "bg-white border-2 border-indigo-50 p-3 rounded-xl flex justify-between items-center text-xs mb-2 shadow-sm";
                    item.innerHTML = `<span class="font-bold text-indigo-900">${d.email}</span><button onclick="window.adminRemoveBlack('${docSnap.id}')" class="text-indigo-400 font-bold">해제</button>`;
                    list.appendChild(item);
                });
            });
        }

        window.adminDeleteRes = async (id) => { if(confirm('강제 취소하시겠습니까?')) await deleteDoc(doc(db, "reservations", id)); };
        window.adminRemoveBlack = async (id) => { if(confirm('블랙리스트에서 삭제할까요?')) await deleteDoc(doc(db, "blacklist", id)); };
        document.getElementById('btnBlackAdd').onclick = async () => {
            const emailValue = document.getElementById('blackInput').value.trim();
            if(!emailValue) return;
            await addDoc(collection(db, "blacklist"), { email: emailValue });
            document.getElementById('blackInput').value = ''; showToast("🚫 차단 등록 완료");
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => { const d = doc.data(); events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime, user: d.user } }); });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });
    </script>
</body>
</html>
