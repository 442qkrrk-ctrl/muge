<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계마을학교 시설 예약</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* 타이틀 스타일 */
        .main-title { font-size: 1.5rem; font-weight: 900; color: #065f46; letter-spacing: -1px; }

        /* [v6.5] 시설 이름 짤림 방지 및 가독성 스타일 */
        #calendar { max-width: 100% !important; margin: 0 auto; background: white; border-radius: 15px; }
        
        /* 이벤트 칩 디자인 최적화 */
        .fc-event { border: none !important; background: none !important; }
        .event-chip {
            font-size: 9px !important;
            line-height: 1.1;
            padding: 2px 4px;
            margin: 1px 0;
            border-radius: 4px;
            color: white;
            font-weight: 700;
            display: block;
            white-space: nowrap; /* 한 줄 유지 */
            overflow: hidden;    /* 넘치면 숨김 */
            text-overflow: clip; /* 짤리더라도 점(..) 대신 글자 끝까지 표시 */
        }

        /* 시설별 고유 색상 (가시성 확보) */
        .bg-band { background-color: #10b981 !important; } /* 밴드실 - 초록 */
        .bg-bread { background-color: #f59e0b !important; } /* 제빵실 - 주황 */
        .bg-work { background-color: #6366f1 !important; }  /* 공작실 - 보라 */
        .bg-study { background-color: #3b82f6 !important; } /* 강의실 - 파랑 */
        .bg-multi { background-color: #ec4899 !important; } /* 다목적실 - 핑크 */

        /* 모바일 헤더 압축 */
        @media (max-width: 768px) {
            .fc-toolbar-title { font-size: 1rem !important; }
            .fc-header-toolbar { margin-bottom: 0.5rem !important; padding: 5px !important; }
            #bookingModal { align-items: flex-end; }
            .modal-content { border-radius: 20px 20px 0 0; }
        }

        #bookingModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center py-4 px-1">
            <h1 class="main-title">무계마을학교 시설 예약</h1>
            <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
        </header>

        <div id="calendar" class="shadow-sm border border-slate-100"></div>

        <div id="bookingModal">
            <div class="modal-content w-full bg-white max-w-md">
                <div class="p-6 space-y-4">
                    <h3 id="modalDateDisplay" class="font-black text-lg text-emerald-800">날짜 선택</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="modalTime" class="p-4 border rounded-xl font-bold bg-slate-50 text-sm"></select>
                        <select id="modalRoom" class="p-4 border rounded-xl font-bold bg-slate-50 text-sm">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                    <div class="flex gap-3">
                        <button id="btnCancel" class="flex-1 py-4 text-slate-400 font-bold">취소</button>
                        <button id="btnConfirm" class="flex-[2] py-4 bg-emerald-600 text-white font-black rounded-xl shadow-lg">예약 확정</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let currentDay = "";
        const modal = document.getElementById('bookingModal');

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto',
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            dateClick: (info) => {
                if (!auth.currentUser) return alert("로그인이 필요합니다.");
                currentDay = info.dateStr;
                document.getElementById('modalDateDisplay').innerText = currentDay + " 예약";
                modal.style.display = 'flex';
            },
            eventContent: (arg) => {
                // 시설명에 따른 클래스 부여
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band";
                else if(arg.event.title.includes("제빵")) cls = "bg-bread";
                else if(arg.event.title.includes("공작")) cls = "bg-work";
                else if(arg.event.title.includes("강의")) cls = "bg-study";

                return { html: `<div class="event-chip ${cls}">${arg.event.extendedProps.shortTime} ${arg.event.title}</div>` };
            },
            eventClick: async (info) => {
                if (confirm('삭제하시겠습니까?')) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        document.getElementById('btnCancel').onclick = () => modal.style.display = 'none';
        document.getElementById('btnConfirm').onclick = async () => {
            await addDoc(collection(db, "reservations"), {
                user: auth.currentUser.email,
                room: document.getElementById('modalRoom').value,
                time: `${currentDay}T${modalTime.value}`,
                shortTime: modalTime.value
            });
            modal.style.display = 'none';
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);
        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });
    </script>
</body>
</html>
