<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        
        #bookingSection, #userInfo, #adminUserList { display: none; }
        
        /* [v6.0] PC/모바일 공용 낭낭한 한 줄 UI */
        .input-row { display: flex; gap: 8px; width: 100%; margin-bottom: 15px; }
        .big-box { 
            flex: 1; min-height: 60px; background: white; border: 3px solid #e2e8f0; 
            border-radius: 14px; font-size: 16px !important; font-weight: 800; 
            text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .big-box:hover { border-color: #10b981; }
        
        #displayDate { flex: 1.2; background: #f1f5f9; color: #0f172a; border-style: dashed; cursor: default; }
        #bookTimeSelect { background: #1e293b; color: white; border-color: #1e293b; }
        #roomName { flex: 1.3; background: #f0fdf4; color: #166534; border-color: #d1fae5; }

        /* 캘린더 클릭 활성화 */
        .fc-daygrid-day { cursor: pointer !important; transition: 0.2s; }
        .fc-daygrid-day:hover { background-color: #f0fdf4 !important; }
        
        .fc { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: none; }
        .fc-toolbar-title { font-weight: 900; color: #065f46; }

        @media (max-width: 768px) {
            .input-row { gap: 4px; }
            .big-box { min-height: 50px; font-size: 13px !important; border-width: 2px; }
            .fc-toolbar-title { font-size: 1.2rem !important; }
        }

        .fc-button-primary { background-color: #059669 !important; border: none !important; font-weight: bold !important; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-[1000px] mx-auto px-4 pt-8">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-emerald-800 tracking-tighter">무계마을학교 🏫</h1>
            <div id="userInfo" class="hidden">
                <span id="userDisplay" class="text-sm font-bold text-slate-500 mr-4"></span>
                <button id="btnLogout" class="text-sm text-red-500 font-bold border-b-2 border-red-200">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-2xl mb-10">
            <div class="space-y-4">
                <input type="email" id="emailInput" placeholder="이메일" class="w-full p-4 rounded-xl border-2 outline-none focus:border-emerald-500">
                <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full p-4 rounded-xl border-2 outline-none focus:border-emerald-500">
                <button id="btnLogin" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl text-xl">로그인 / 가입</button>
            </div>
        </section>

        <section id="bookingSection" class="mb-12">
            <div class="bg-white p-5 rounded-3xl shadow-2xl border-b-8 border-emerald-600">
                <p class="text-xs font-black text-emerald-600 mb-3 ml-1 uppercase">Step 1: Click Date on Calendar / Step 2: Set Time & Room</p>
                <div class="input-row">
                    <input type="text" id="displayDate" class="big-box" readonly placeholder="날짜를 클릭하세요">
                    <select id="bookTimeSelect" class="big-box"></select>
                    <select id="roomName" class="big-box">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                </div>
                <button id="btnSave" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl text-xl hover:bg-emerald-700 transition-colors">예약 확정하기</button>
            </div>
        </section>

        <div id="calendar"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 시간 옵션
        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let selectedFullDate = ""; 

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
            selectable: true,
            // [PC 클릭 보강]
            dateClick: function(info) {
                console.log("Date Clicked:", info.dateStr); // 디버깅용
                selectedFullDate = info.dateStr; 
                const parts = selectedFullDate.split('-');
                document.getElementById('displayDate').value = `${parts[0]}년 ${parts[1]}월 ${parts[2]}일`;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            eventContent: function(arg) {
                return { html: `<div class="p-1 bg-emerald-50 text-emerald-800 rounded text-[10px] font-bold"><b>${arg.event.extendedProps.shortTime}</b> ${arg.event.title}</div>` };
            },
            eventClick: async function(info) {
                if (confirm(`'${info.event.title}' 예약을 삭제할까요?`)) {
                    await deleteDoc(doc(db, "reservations", info.event.id));
                }
            }
        });
        calendar.render();

        onAuthStateChanged(auth, async (user) => {
            const ui = { auth: document.getElementById('authForm'), info: document.getElementById('userInfo'), book: document.getElementById('bookingSection') };
            if (user) {
                ui.auth.style.display = 'none'; ui.info.classList.remove('hidden'); ui.book.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님 로그온";
            } else { ui.auth.style.display = 'block'; ui.info.classList.add('hidden'); ui.book.style.display = 'none'; }
        });

        document.getElementById('btnLogin').onclick = async () => {
            const email = emailInput.value; const pw = passwordInput.value;
            try { await signInWithEmailAndPassword(auth, email, pw); } 
            catch { 
                try { 
                    const u = await createUserWithEmailAndPassword(auth, email, pw); 
                    await setDoc(doc(db, "users", u.user.uid), { email, isAdmin: false, joinedAt: new Date().toISOString() });
                } catch(e) { alert("로그인 정보를 확인해주세요."); }
            }
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const time = timeSelect.value;
            if(!selectedFullDate) return alert("달력에서 날짜를 먼저 클릭해주세요!");
            
            await addDoc(collection(db, "reservations"), { 
                user: auth.currentUser.email, 
                room, 
                time: `${selectedFullDate}T${time}`, 
                shortTime: time 
            });
            alert(`✅ 예약 완료: ${selectedFullDate} ${time}`);
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });
    </script>
</body>
</html>
