<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge 통합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        /* 초기 상태를 'display: none'으로 설정하되, 자바스크립트로 확실히 제어 */
        #bookingSection, #adminPanel, #userInfo { display: none; }
        .admin-badge { background: linear-gradient(135deg, #f59e0b, #d97706); }
    </style>
</head>
<body class="min-h-screen py-10">

    <div class="max-w-xl mx-auto px-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">🎸 Muge 통합 시스템</h1>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div id="authForm">
                <div class="space-y-3">
                    <input type="email" id="email" placeholder="이메일 주소" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <input type="password" id="password" placeholder="비밀번호" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <div class="flex gap-2">
                        <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">로그인</button>
                        <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg hover:bg-slate-200 transition">회원가입</button>
                    </div>
                </div>
            </div>

            <div id="userInfo" class="flex items-center justify-between">
                <div>
                    <div id="userBadgeArea" class="mb-1 flex gap-1"></div>
                    <p id="userDisplay" class="font-bold text-slate-800"></p>
                </div>
                <button id="btnLogout" class="text-sm text-red-500 hover:font-bold transition">로그아웃</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 border-l-4 border-l-blue-500">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">📅 새 예약 만들기</h2>
            <div class="space-y-4">
                <select id="roomName" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <option value="A룸 (큰방)">A룸 (큰방)</option>
                    <option value="B룸 (중간방)">B룸 (중간방)</option>
                    <option value="C룸 (개인연습)">C룸 (개인연습)</option>
                </select>
                <input type="datetime-local" id="bookTime" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <button id="btnSave" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">예약 확정</button>
            </div>
        </section>

        <section id="adminPanel" class="bg-white p-6 rounded-2xl shadow-sm border-2 border-orange-200 mb-6 bg-orange-50/50">
            <h2 class="text-lg font-semibold mb-4 text-orange-700 font-bold">👑 회원 승인 관리</h2>
            <div id="userList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">📋 실시간 예약 현황</h2>
            <div id="bookingList" class="space-y-3"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            const authForm = document.getElementById('authForm'), userInfo = document.getElementById('userInfo');
            const bookingSection = document.getElementById('bookingSection'), adminPanel = document.getElementById('adminPanel');

            if (user) {
                // 로그인 시 UI 노출 (display: block 강제 적용)
                authForm.style.display = 'none';
                userInfo.style.display = 'flex';
                bookingSection.style.display = 'block'; // [핵심] 예약창 강제 노출
                document.getElementById('userDisplay').textContent = user.email;

                // DB 데이터 감시 (뱃지 및 관리자용)
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    const badgeArea = document.getElementById('userBadgeArea');
                    badgeArea.innerHTML = "";
                    if(snap.exists()){
                        const data = snap.data();
                        const isApproved = String(data.approved) === "true";
                        const isManager = String(data.isAdmin) === "true";

                        const b = document.createElement('span');
                        b.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${isApproved ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`;
                        b.textContent = isApproved ? "승인됨" : "승인 대기";
                        badgeArea.appendChild(b);

                        if(isManager) {
                            adminPanel.style.display = 'block';
                            loadUserList();
                        }
                    }
                });
            } else {
                authForm.style.display = 'block';
                userInfo.style.display = 'none';
                bookingSection.style.display = 'none';
                adminPanel.style.display = 'none';
            }
        });

        // 나머지 버튼 이벤트(Login, Signup, Logout, Save)는 이전 v1.9와 동일
        document.getElementById('btnLogin').onclick = () => {
            signInWithEmailAndPassword(auth, email.value, password.value).catch(e => alert("로그인 실패"));
        };
        document.getElementById('btnSignup').onclick = async () => {
            const userCred = await createUserWithEmailAndPassword(auth, email.value, password.value);
            await setDoc(doc(db, "users", userCred.user.uid), { email: email.value, approved: false, isAdmin: false });
            alert("가입 완료");
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        
        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value, time = document.getElementById('bookTime').value;
            if(!time) return alert("시간 선택!");
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time, createdAt: serverTimestamp() });
            alert("예약 완료!");
        };

        // 실시간 예약 목록 표시
        onSnapshot(query(collection(db, "reservations"), orderBy("time", "asc")), (snap) => {
            const list = document.getElementById('bookingList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                list.innerHTML += `<div class="p-3 bg-white rounded-xl border mb-2 shadow-sm border-l-4 border-l-slate-300">
                    <p class="font-bold text-sm">${item.room}</p>
                    <p class="text-[10px] text-slate-500">⏰ ${item.time.replace('T',' ')} / ${item.user.split('@')[0]}님</p>
                </div>`;
            });
        });

        function loadUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    if(u.email === auth.currentUser.email) return;
                    list.innerHTML += `<div class="flex justify-between items-center p-2 border-b text-xs">
                        <span>${u.email}</span>
                        <button onclick="updateDoc(doc(db, 'users', '${uDoc.id}'), {approved: ${!u.approved}})" class="bg-slate-200 px-2 py-1 rounded">${u.approved?'취소':'승인'}</button>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
