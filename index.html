<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.8.6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        #calendar-container { background: white; border-radius: 20px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; margin-bottom: 50px; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900 !important; color: #065f46; }
        .fc-button { font-size: 0.8rem !important; font-weight: 800 !important; border-radius: 8px !important; }
        .fc-day-sat { background-color: #eff6ff !important; } 
        .holiday-cell { background-color: #fee2e2 !important; position: relative; }
        .holiday-cell::after { content: '휴관'; position: absolute; bottom: 2px; right: 5px; font-size: 9px; color: #ef4444; font-weight: 900; }
        .event-chip { font-size: 10px; padding: 4px; border-radius: 6px; color: white; font-weight: 700; width: 100%; cursor: pointer; }
        .bg-band { background-color: #10b981 !important; } .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; } .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        #toast { visibility: hidden; min-width: 200px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <div>
                <h1 class="text-xl font-black text-emerald-900">무계행복마을학교</h1>
                <p class="text-[10px] font-bold text-emerald-600 tracking-tighter">시설 예약 시스템 (v1.8.6)</p>
            </div>
            <div class="flex gap-2 items-center">
                <button id="btnAdminOpen" class="hidden text-[10px] bg-indigo-600 text-white px-3 py-2 rounded-xl font-black shadow-lg">관리자</button>
                <div id="loginInfo" class="text-right hidden">
                    <span id="userNick" class="text-[11px] font-black block text-slate-700"></span>
                    <button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button>
                </div>
            </div>
        </header>

        <div id="calendar-container"><div id="calendar"></div></div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-white max-w-sm p-6 rounded-[30px] shadow-2xl">
                <h3 id="modalDateDisplay" class="font-black text-lg text-center mb-6 text-slate-800">예약 신청</h3>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="text-[14px] font-bold text-slate-400 ml-1">시설 선택</label>
                        <select id="modalRoom" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none">
                            <option value="밴드실">🎸 밴드실</option><option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option><option value="강의실">📖 강의실</option><option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[14px] font-bold text-slate-400 ml-1">시간 선택</label>
                        <select id="modalTime" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none"></select>
                    </div>
                </div>
                <div class="bg-slate-900 p-5 rounded-2xl mb-6 text-slate-300">
                    <h4 class="text-[12px] font-black text-emerald-400 mb-2">📋 필수 이용 수칙</h4>
                    <ul class="text-[11px] space-y-1 mb-4 font-medium"><li>• 퇴실 시 전등 및 냉난방기 OFF</li><li>• 비품 정리 및 쓰레기 수거</li></ul>
                    <label class="flex items-center gap-3 cursor-pointer pt-3 border-t border-slate-800"><input type="checkbox" id="agreeRules" class="w-5 h-5 accent-emerald-500"><span class="text-xs font-black text-white">수칙 준수 동의</span></label>
                </div>
                <div class="flex gap-2"><button id="btnCloseBooking" class="flex-1 py-3 text-slate-400 font-bold">취소</button><button id="btnConfirm" disabled class="flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl">예약 확정</button></div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-slate-50 max-w-2xl p-6 rounded-[30px] shadow-2xl max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-6"><h3 class="font-black text-xl text-indigo-950">운영 관리</h3><button id="btnCloseAdmin" class="text-slate-400 font-bold">닫기</button></div>
                
                <section class="mb-8 p-4 bg-white rounded-2xl border">
                    <h4 class="font-black text-sm mb-3 text-red-600">🗓 휴관일 설정</h4>
                    <div class="flex gap-2 mb-3"><input type="date" id="holidayDateInput" class="flex-1 p-3 border-2 border-slate-50 rounded-xl text-xs outline-none"><button id="btnAddHoliday" class="bg-red-500 text-white px-4 py-3 rounded-xl text-xs font-black shadow-md">등록</button></div>
                    <div id="holidayListArea" class="flex flex-wrap gap-2"></div>
                </section>

                <section class="mb-8 p-4 bg-white rounded-2xl border">
                    <h4 class="font-black text-sm mb-3 text-slate-800">🚫 블랙리스트 관리</h4>
                    <div class="flex gap-2 mb-3"><input type="email" id="blackEmailInput" placeholder="차단할 이메일" class="flex-1 p-3 border-2 border-slate-50 rounded-xl text-xs outline-none"><button id="btnAddBlack" class="bg-slate-900 text-white px-4 py-3 rounded-xl text-xs font-black shadow-md">차단</button></div>
                    <div id="blackListArea" class="space-y-1"></div>
                </section>

                <section>
                    <h4 class="font-black text-sm mb-3 text-indigo-600">📝 전체 예약 현황</h4>
                    <div id="adminList" class="space-y-2 text-xs bg-white p-3 rounded-2xl border max-h-60 overflow-y-auto"></div>
                </section>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAILS = ["442qkrrk@gmail.com", "nyamachoma@naver.com"];
        const isAdmin = (email) => ADMIN_EMAILS.includes(email);

        let currentDay = "";
        let holidayList = [];
        let blackList = [];

        function initTimeSlots() {
            const select = document.getElementById('modalTime'); select.innerHTML = "";
            for (let h = 9; h <= 18; h++) { 
                ['00', '30'].forEach(m => { if(h===18 && m==='30') return; const time = `${String(h).padStart(2, '0')}:${m}`; select.add(new Option(time, time)); }); 
            }
        }
        initTimeSlots();

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        // 중복 방지 핵심 함수
        async function checkReservedSlots() {
            const room = document.getElementById('modalRoom').value;
            const q = query(collection(db, "reservations"), where("date", "==", currentDay), where("room", "==", room));
            const snap = await getDocs(q);
            const booked = snap.docs.map(d => d.data().shortTime);
            
            Array.from(document.getElementById('modalTime').options).forEach(opt => {
                const isBooked = booked.includes(opt.value);
                opt.disabled = isBooked;
                opt.text = isBooked ? `${opt.value} (예약됨)` : opt.value;
            });
            // 만약 현재 선택된 옵션이 방금 disabled 되었다면, 가능한 첫 번째 옵션으로 변경
            const select = document.getElementById('modalTime');
            if (select.selectedOptions[0]?.disabled) {
                const firstAvailable = Array.from(select.options).find(o => !o.disabled);
                if (firstAvailable) select.value = firstAvailable.value;
            }
        }

        async function openBookingModal(date) {
            if (!auth.currentUser) { document.getElementById('authModal').style.display='flex'; return; }
            currentDay = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            if (holidayList.includes(currentDay)) { alert("오늘은 휴관일입니다."); return; }
            document.getElementById('modalDateDisplay').innerText = `${currentDay} 예약`;
            document.getElementById('bookingModal').style.display = 'flex';
            await checkReservedSlots(); // 예약된 시간 체크
        }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'ko',
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek,dayView' },
            buttonText: { today: '오늘', month: '월', week: '주' },
            customButtons: { dayView: { text: '토', click: function() { 
                const current = calendar.getDate(); const sat = new Date(current); sat.setDate(current.getDate() + (6 - current.getDay())); 
                calendar.changeView('timeGridDay', sat); 
            } } },
            dayCellClassNames: (arg) => {
                const dStr = `${arg.date.getFullYear()}-${String(arg.date.getMonth() + 1).padStart(2, '0')}-${String(arg.date.getDate()).padStart(2, '0')}`;
                return holidayList.includes(dStr) ? ['holiday-cell'] : [];
            },
            dateClick: (info) => openBookingModal(info.date),
            eventClick: async (info) => {
                if (confirm('삭제하시겠습니까?')) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("삭제됨"); }
            },
            eventContent: (arg) => {
                const nick = (arg.event.extendedProps.user || "").split('@')[0];
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band"; else if(arg.event.title.includes("제빵")) cls = "bg-bread"; 
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${arg.event.title}</div><div class="opacity-70">[${nick}]</div></div>` };
            }
        });

        const loadAdminData = async () => {
            const rSnap = await getDocs(query(collection(db, "reservations"), orderBy("date", "desc"), orderBy("shortTime", "asc")));
            const list = document.getElementById('adminList'); list.innerHTML = rSnap.empty ? "예약 없음" : "";
            rSnap.forEach(s => {
                const d = s.data(); const div = document.createElement('div');
                div.className = "flex justify-between items-center p-2 border-b last:border-0";
                div.innerHTML = `<div><b>${d.date}</b> ${d.shortTime} [${d.room}] - ${d.user.split('@')[0]}</div><button onclick="deleteBooking('${s.id}')" class="text-red-500 font-bold">삭제</button>`;
                list.appendChild(div);
            });
            const hSnap = await getDocs(collection(db, "holidays"));
            const hArea = document.getElementById('holidayListArea'); hArea.innerHTML = "";
            hSnap.forEach(s => {
                const div = document.createElement('div'); div.className = "bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px] flex items-center gap-1 font-bold";
                div.innerHTML = `${s.data().date}<button onclick="removeHoliday('${s.id}')">×</button>`;
                hArea.appendChild(div);
            });
            const bSnap = await getDocs(collection(db, "blacklist"));
            const bArea = document.getElementById('blackListArea'); bArea.innerHTML = "";
            bSnap.forEach(s => {
                const div = document.createElement('div'); div.className = "flex justify-between text-xs p-2 bg-slate-100 rounded-lg";
                div.innerHTML = `<span>${s.data().email}</span><button onclick="removeBlack('${s.id}')" class="text-red-500 font-bold">해제</button>`;
                bArea.appendChild(div);
            });
        };

        window.deleteBooking = async (id) => { if(confirm('삭제?')) { await deleteDoc(doc(db, "reservations", id)); loadAdminData(); }};
        window.removeHoliday = async (id) => { if(confirm('해제?')) { await deleteDoc(doc(db, "holidays", id)); loadAdminData(); }};
        window.removeBlack = async (id) => { if(confirm('해제?')) { await deleteDoc(doc(db, "blacklist", id)); loadAdminData(); }};

        document.getElementById('modalRoom').onchange = () => checkReservedSlots(); // 시설 변경 시 중복 체크

        document.getElementById('btnAddHoliday').onclick = async () => {
            const date = document.getElementById('holidayDateInput').value;
            if(date) { await addDoc(collection(db, "holidays"), { date }); loadAdminData(); showToast("휴관 등록됨"); }
        };
        document.getElementById('btnAddBlack').onclick = async () => {
            const email = document.getElementById('blackEmailInput').value;
            if(email) { await addDoc(collection(db, "blacklist"), { email }); loadAdminData(); showToast("차단 등록됨"); }
        };

        document.getElementById('btnConfirm').onclick = async () => {
            if(blackList.includes(auth.currentUser.email)) return alert("차단된 사용자입니다.");
            const room = document.getElementById('modalRoom').value;
            const shortTime = document.getElementById('modalTime').value;
            
            // 전송 직전 마지막 중복 확인 (안전장치)
            const q = query(collection(db, "reservations"), where("date", "==", currentDay), where("room", "==", room), where("shortTime", "==", shortTime));
            const check = await getDocs(q);
            if(!check.empty) return alert("그새 다른 예약이 생겼습니다!");

            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, date: currentDay, time: `${currentDay}T${shortTime}`, shortTime });
            document.getElementById('bookingModal').style.display = 'none'; showToast("예약 완료!");
        };

        document.getElementById('btnAdminOpen').onclick = () => { loadAdminData(); document.getElementById('adminModal').style.display = 'flex'; };
        document.getElementById('btnCloseBooking').onclick = () => document.getElementById('bookingModal').style.display = 'none';
        document.getElementById('btnCloseAdmin').onclick = () => document.getElementById('adminModal').style.display = 'none';
        document.getElementById('btnLoginEmail').onclick = () => {
            const e = document.getElementById('authEmail').value, p = document.getElementById('authPw').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("로그인 실패"));
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        document.getElementById('agreeRules').onchange = (e) => {
            const b = document.getElementById('btnConfirm'); b.disabled = !e.target.checked;
            b.classList.toggle('bg-emerald-600', e.target.checked); b.classList.toggle('bg-slate-200', !e.target.checked);
        };

        onSnapshot(collection(db, "holidays"), (snap) => { holidayList = snap.docs.map(doc => doc.data().date); calendar.render(); });
        onSnapshot(collection(db, "blacklist"), (snap) => { blackList = snap.docs.map(doc => doc.data().email); });
        onSnapshot(collection(db, "reservations"), (snap) => {
            const evs = snap.docs.map(s => { const d = s.data(); return { id: s.id, title: d.room, start: d.time, extendedProps: { ...d } }; });
            calendar.removeAllEvents(); calendar.addEventSource(evs);
        });
        onAuthStateChanged(auth, (u) => {
            document.getElementById('authModal').style.display = u ? 'none' : 'flex';
            document.getElementById('loginInfo').classList.toggle('hidden', !u);
            if(u && isAdmin(u.email)) document.getElementById('btnAdminOpen').classList.remove('hidden');
            if(u) document.getElementById('userNick').innerText = u.email.split('@')[0] + "님";
        });

        calendar.render();
    </script>
</body>
</html>
