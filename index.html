<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계마을학교 시설 예약</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        
        /* 헤더 스타일 */
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; align-items: center !important; gap: 10px; padding: 12px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900; color: #1e293b; }
        .fc-button { padding: 5px 10px !important; font-size: 11px !important; font-weight: 800 !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }

        /* [v7.2] 터치 및 클릭 최적화 */
        .fc-timegrid-slot { height: 70px !important; } 
        
        /* 날짜 헤더 영역 클릭 가능하게 시각적 피드백 */
        .fc-col-header-cell-cushion { width: 100%; padding: 10px 0 !important; display: block !important; cursor: pointer !important; }
        .fc-highlight { background: rgba(16, 185, 129, 0.2) !important; } 

        /* 시설별 색상 */
        .event-chip { font-size: 10px; padding: 2px 4px; border-radius: 4px; color: white; font-weight: 700; border: none; }
        .bg-band { background-color: #10b981 !important; }
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; }
        .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }

        #calendar { background: white; border-radius: 16px; padding: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        #bookingModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        @media (max-width: 768px) { #bookingModal { align-items: flex-end; } }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1100px] mx-auto">
        <header class="flex justify-between items-center py-4 px-2">
            <h1 class="text-xl font-black text-emerald-800">무계마을학교 시설 예약</h1>
            <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
        </header>

        <div id="calendar"></div>

        <div id="bookingModal">
            <div class="modal-content w-full bg-white max-w-md p-6 rounded-t-3xl md:rounded-3xl shadow-2xl">
                <h3 id="modalDateDisplay" class="font-black text-lg mb-4 text-slate-800 text-center">예약 일시</h3>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <select id="modalTime" class="p-4 border rounded-xl font-bold bg-slate-50 text-sm"></select>
                    <select id="modalRoom" class="p-4 border rounded-xl font-bold bg-slate-50 text-sm">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button id="btnCancel" class="flex-1 py-4 text-slate-400 font-bold">닫기</button>
                    <button id="btnConfirm" class="flex-[2] py-4 bg-emerald-600 text-white font-black rounded-xl">예약 완료</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let currentDay = "";
        const modal = document.getElementById('bookingModal');

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            height: 'auto',
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            selectable: true, 
            headerToolbar: {
                left: 'title',
                center: '',
                right: 'prev,next today dayGridMonth,timeGridWeek'
            },
            select: function(info) {
                if (!auth.currentUser) return alert("로그인 필요");
                
                currentDay = info.startStr.split('T')[0];
                if (info.startStr.includes('T')) {
                    const time = info.startStr.split('T')[1].substring(0, 5);
                    modalTime.value = time;
                }

                document.getElementById('modalDateDisplay').innerText = currentDay + " 예약";
                modal.style.display = 'flex';
                calendar.unselect(); 
            },
            eventContent: (arg) => {
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band";
                else if(arg.event.title.includes("제빵")) cls = "bg-bread";
                else if(arg.event.title.includes("공작")) cls = "bg-work";
                else if(arg.event.title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}">${arg.event.extendedProps.shortTime} ${arg.event.title}</div>` };
            },
            eventClick: async (info) => {
                if (confirm('삭제하시겠습니까?')) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        document.getElementById('btnCancel').onclick = () => modal.style.display = 'none';
        document.getElementById('btnConfirm').onclick = async () => {
            await addDoc(collection(db, "reservations"), {
                user: auth.currentUser.email,
                room: document.getElementById('modalRoom').value,
                time: `${currentDay}T${modalTime.value}`,
                shortTime: modalTime.value
            });
            modal.style.display = 'none';
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);
        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                const startTime = new Date(d.time);
                const endTime = new Date(startTime.getTime() + 60 * 60000);
                events.push({ id: doc.id, title: d.room, start: d.time, end: endTime.toISOString(), extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });
    </script>
</body>
</html>
