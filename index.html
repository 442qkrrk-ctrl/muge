<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fdfbf7; -webkit-tap-highlight-color: transparent; }
        
        #bookingSection, #userInfo, #adminUserList { display: none; }
        
        /* [v5.7] 확실한 클릭을 위한 낭낭한 스타일 */
        .input-row-container {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
        }

        .big-box {
            display: block;
            width: 100%;
            min-height: 54px; /* 확실한 터치 높이 확보 */
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px !important;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            z-index: 10; /* 클릭 우선순위 확보 */
            position: relative;
        }

        /* 날짜/시간/장소 비중 조절 */
        #displayDate { flex: 1.2; background: #f1f5f9; border-style: dashed; }
        #bookTimeSelect { flex: 1; background: #1e293b; color: white; border-color: #1e293b; }
        #roomName { flex: 1.5; background: #f0fdf4; color: #065f46; border-color: #d1fae5; }

        /* 캘린더 타이틀 (모바일 2줄) */
        .fc-toolbar-title { display: flex !important; flex-direction: column !important; align-items: center !important; line-height: 1.1 !important; font-size: 0.85rem !important; font-weight: 800; color: #065f46; }
        .fc-toolbar-title::after { content: attr(data-month); font-size: 1.25rem !important; display: block; }

        @media (min-width: 768px) {
            .max-w-md { max-width: 1100px !important; }
            .fc-toolbar-title { flex-direction: row !important; gap: 8px; font-size: 2rem !important; }
            .fc-toolbar-title::after { font-size: 2rem !important; }
            .big-box { min-height: 70px; font-size: 18px !important; }
        }

        /* 캘린더 내부 이벤트 */
        .month-event-box { display: flex; flex-direction: column; width: 100%; padding: 1px; }
        .month-time { font-size: 8px; font-weight: 900; }
        .month-room { font-size: 9px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
        
        .fc-button-primary { background-color: #065f46 !important; border-color: #065f46 !important; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div class="max-w-md mx-auto px-3 pt-6">
        <header class="flex justify-between items-center mb-6 px-1">
            <h1 class="text-2xl font-black text-emerald-700">무계행복마을학교</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-[10px] font-bold block text-slate-400"></span>
                <button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-5 rounded-2xl shadow-sm border mb-4">
            <div class="flex gap-2 mb-2">
                <input type="email" id="emailInput" placeholder="이메일" class="flex-1 p-3 rounded-xl border text-sm">
                <input type="password" id="passwordInput" placeholder="비번" class="flex-1 p-3 rounded-xl border text-sm">
            </div>
            <button id="btnLogin" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">로그인 / 시작하기</button>
        </section>

        <section id="bookingSection" class="bg-white p-4 rounded-2xl shadow-xl border-t-4 border-t-emerald-500 mb-6">
            <div class="input-row-container">
                <input type="text" id="displayDate" class="big-box" readonly placeholder="날짜선택">
                <select id="bookTimeSelect" class="big-box"></select>
                <select id="roomName" class="big-box">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
            </div>
            <button id="btnSave" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg">예약 확정하기</button>
        </section>

        <div id="calendar"></div>

        <div id="adminUserList" class="mt-8 bg-white p-5 rounded-2xl shadow-sm border border-orange-200">
            <h3 class="font-black text-orange-600 mb-3 text-sm">📢 가입자 현황</h3>
            <ul id="userUl" class="text-[11px] space-y-2"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let selectedFullDate = ""; 

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            selectable: true,
            dateClick: function(info) {
                selectedFullDate = info.dateStr; 
                const parts = selectedFullDate.split('-');
                document.getElementById('displayDate').value = `${parts[1]}.${parts[2]}`;
                // 예약바가 위쪽에 있으므로 클릭 시 상단으로 이동
                window.scrollTo({ top: 100, behavior: 'smooth' });
            },
            datesSet: function() {
                const titleEl = document.querySelector('.fc-toolbar-title');
                if (titleEl) {
                    const parts = calendar.view.title.split(' ');
                    if(parts.length >= 2) { titleEl.innerText = parts[0]; titleEl.setAttribute('data-month', parts[1]); }
                }
            },
            eventContent: function(arg) {
                const room = arg.event.title;
                const timeStr = arg.event.extendedProps.shortTime;
                return { html: `<div class="month-event-box"><span class="month-time">${timeStr}</span><span class="month-room">${room}</span></div>` };
            },
            eventClick: async function(info) { if (confirm(`삭제하시겠습니까?`)) await deleteDoc(doc(db, "reservations", info.event.id)); }
        });
        calendar.render();

        onAuthStateChanged(auth, async (user) => {
            const ui = { auth: document.getElementById('authForm'), info: document.getElementById('userInfo'), book: document.getElementById('bookingSection'), admin: document.getElementById('adminUserList') };
            if (user) {
                ui.auth.style.display = 'none'; ui.info.style.display = 'block'; ui.book.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님";
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    ui.admin.style.display = 'block';
                    onSnapshot(collection(db, "users"), (snap) => {
                        const userUl = document.getElementById('userUl'); userUl.innerHTML = "";
                        snap.forEach(doc => {
                            const d = doc.data();
                            const li = document.createElement('li'); li.className = "flex justify-between py-1 border-b border-slate-50";
                            li.innerHTML = `<span>👤 ${d.email}</span><span class="text-[9px] text-slate-400">${d.joinedAt?.split('T')[0] || ''}</span>`;
                            userUl.appendChild(li);
                        });
                    });
                }
            } else { ui.auth.style.display = 'block'; ui.info.style.display = 'none'; ui.book.style.display = 'none'; ui.admin.style.display = 'none'; }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert("로그인 정보를 확인하세요!"));
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const time = timeSelect.value;
            if(!selectedFullDate) return alert("먼저 달력에서 날짜를 클릭해주세요!");
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time: `${selectedFullDate}T${time}`, shortTime: time });
            alert(`✅ 예약 완료!`);
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, backgroundColor: getRoomColor(d.room), extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#10b981", "제빵실": "#f59e0b", "공작실": "#6366f1", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room.trim()] || "#64748b";
        }
    </script>
</body>
</html>
