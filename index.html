<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge 통합 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        #bookingSection, #adminPanel, #userInfo { display: none; }
        .admin-badge { background: linear-gradient(135deg, #f59e0b, #d97706); }
    </style>
</head>
<body class="min-h-screen py-10">

    <div class="max-w-xl mx-auto px-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">🎸 Muge 통합 시스템</h1>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div id="authForm">
                <div class="space-y-3">
                    <input type="email" id="emailInput" placeholder="이메일 주소" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <div class="flex gap-2">
                        <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">로그인</button>
                        <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg hover:bg-slate-200 transition">회원가입</button>
                    </div>
                </div>
            </div>

            <div id="userInfo" class="flex items-center justify-between">
                <div>
                    <div id="userBadgeArea" class="mb-1 flex gap-1"></div>
                    <p id="userDisplay" class="font-bold text-slate-800"></p>
                </div>
                <button id="btnLogout" class="text-sm text-red-500 hover:font-bold transition">로그아웃</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 border-l-4 border-l-blue-500">
            <h2 class="text-lg font-semibold mb-2 text-slate-700">📅 새 예약 만들기</h2>
            <p class="text-[11px] text-blue-500 mb-4 font-medium">* 30분 단위만 가능 / 앞뒤 2시간 간격 필수</p>
            <div class="space-y-4">
                <select id="roomName" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="datetime-local" id="bookTime" step="1800" class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none">
                <button id="btnSave" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">예약 확정</button>
            </div>
        </section>

        <section id="adminPanel" class="bg-white p-6 rounded-2xl shadow-sm border-2 border-orange-200 mb-6 bg-orange-50/50">
            <h2 class="text-lg font-semibold mb-4 text-orange-700 font-bold">👑 회원 승인 관리</h2>
            <div id="userList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">📋 실시간 예약 현황</h2>
            <div id="bookingList" class="space-y-3"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, getDocs, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');

        onAuthStateChanged(auth, (user) => {
            const authForm = document.getElementById('authForm'), userInfo = document.getElementById('userInfo');
            const bookingSection = document.getElementById('bookingSection'), adminPanel = document.getElementById('adminPanel');

            if (user) {
                authForm.style.display = 'none';
                userInfo.style.display = 'flex';
                bookingSection.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email;

                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    const badgeArea = document.getElementById('userBadgeArea');
                    badgeArea.innerHTML = "";
                    if(snap.exists()){
                        const data = snap.data();
                        const isApproved = String(data.approved) === "true";
                        const isManager = String(data.isAdmin) === "true";
                        const b = document.createElement('span');
                        b.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${isApproved ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`;
                        b.textContent = isApproved ? "승인됨" : "승인 대기";
                        badgeArea.appendChild(b);
                        if(isManager) { adminPanel.style.display = 'block'; loadUserList(); }
                    }
                });
            } else {
                authForm.style.display = 'block'; userInfo.style.display = 'none';
                bookingSection.style.display = 'none'; adminPanel.style.display = 'none';
            }
        });

        // 예약 저장 (v2.4 강제 검증 로직 포함)
        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const timeStr = document.getElementById('bookTime').value;
            if(!timeStr) return alert("예약 시간을 선택해 주세요!");

            const dateObj = new Date(timeStr);
            const minutes = dateObj.getMinutes();

            // 1. 30분 단위 강제 검사
            if (minutes !== 0 && minutes !== 30) {
                return alert("❌ 예약은 30분 단위(예: 14:00, 14:30)로만 가능합니다!");
            }

            const selectedTime = dateObj.getTime();
            const TWO_HOURS = 2 * 60 * 60 * 1000;

            try {
                const q = query(collection(db, "reservations"), where("room", "==", room));
                const querySnapshot = await getDocs(q);
                
                let isConflict = false;
                querySnapshot.forEach((doc) => {
                    const existingTime = new Date(doc.data().time).getTime();
                    if (Math.abs(selectedTime - existingTime) < TWO_HOURS) {
                        isConflict = true;
                    }
                });

                if (isConflict) {
                    return alert("❌ 이미 예약된 시간과 너무 가깝습니다 (앞뒤 2시간 간격 필요).");
                }

                await addDoc(collection(db, "reservations"), {
                    user: auth.currentUser.email,
                    room: room,
                    time: timeStr,
                    createdAt: serverTimestamp()
                });
                alert("✅ 예약이 확정되었습니다!");
            } catch (e) { alert("예약 에러: " + e.message); }
        };

        // 기타 기능
        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert("로그인 실패"));
        document.getElementById('btnSignup').onclick = async () => {
            const userCred = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            await setDoc(doc(db, "users", userCred.user.uid), { email: emailInput.value, approved: false, isAdmin: false });
            alert("가입 완료!");
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onSnapshot(query(collection(db, "reservations"), orderBy("time", "asc")), (snap) => {
            const list = document.getElementById('bookingList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                list.innerHTML += `<div class="p-3 bg-white rounded-xl border mb-2 shadow-sm border-l-4 border-l-slate-300">
                    <p class="font-bold text-sm text-slate-800">${item.room}</p>
                    <p class="text-[10px] text-slate-500 mt-1">⏰ ${item.time.replace('T',' ')} / ${item.user.split('@')[0]}님</p>
                </div>`;
            });
        });

        function loadUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                snap.forEach(uDoc => {
                    if(uDoc.data().email === auth.currentUser.email) return;
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-2 border-b text-xs";
                    div.innerHTML = `<span>${uDoc.data().email}</span>`;
                    const btn = document.createElement('button');
                    btn.className = "bg-slate-200 px-2 py-1 rounded font-bold";
                    btn.textContent = uDoc.data().approved ? '취소' : '승인';
                    btn.onclick = () => updateDoc(doc(db, 'users', uDoc.id), { approved: !uDoc.data().approved });
                    div.appendChild(btn);
                    list.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
