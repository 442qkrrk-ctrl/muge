<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge v3.7 - Clean Black Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #bookingSection, #adminPanel, #userInfo { display: none; }
        
        /* [캘린더 기본 스타일] */
        .fc { background: white; padding: 12px; border-radius: 1.25rem; border: 1px solid #e2e8f0; height: 80vh; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .fc-header-toolbar { scale: 0.9; }

        /* [v3.7 월 보기 - 검은색 텍스트 & 클린 디자인] */
        .month-event-box { 
            display: flex; align-items: center; width: 100%; padding: 2px 4px; min-height: 22px; 
        }
        .month-time { 
            font-size: 9px; 
            background: rgba(255, 255, 255, 0.6); /* 시간 배경을 밝게 처리 */
            color: #000000 !important; /* 시간 검은색 */
            padding: 1px 4px; border-radius: 4px; font-weight: 700; margin-right: 6px; flex-shrink: 0;
            border: 0.5px solid rgba(0,0,0,0.1);
        }
        .month-room { 
            font-size: 11px; 
            font-weight: 700; 
            color: #000000 !important; /* 장소명 검은색 */
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* [주 보기 - 기존 스타일 유지] */
        .week-event-box { padding: 4px; line-height: 1.3; }
        .week-room { font-size: 0.85rem; font-weight: 800; display: block; color: #ffffff; margin-bottom: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .week-user { font-size: 0.75rem; font-weight: 400; color: rgba(255, 255, 255, 0.9); }

        /* 이벤트 박스 투명도 조절로 파스텔톤 느낌 유도 (검은 글씨가 잘 보이게) */
        .fc-daygrid-event {
            border: none !important;
            margin: 1px 2px !important;
            padding: 0 !important;
            opacity: 0.9; /* 배경색을 약간 연하게 하여 검은 글씨 강조 */
        }
    </style>
</head>
<body class="min-h-screen py-8">

    <div class="max-w-4xl mx-auto px-4">
        <header class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-3xl font-black text-blue-600 tracking-tighter">Muge v3.7</h1>
            <div id="userInfo" class="flex items-center gap-4 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100">
                <span id="userDisplay" class="text-xs font-bold text-slate-600"></span>
                <button id="btnLogout" class="text-xs text-red-500 font-bold hover:underline">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <input type="email" id="emailInput" placeholder="이메일" class="w-full px-4 py-3 rounded-xl border-slate-200 border outline-none">
                <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full px-4 py-3 rounded-xl border-slate-200 border outline-none">
            </div>
            <div class="flex gap-2">
                <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">로그인</button>
                <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">회원가입</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-blue-600 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                <select id="roomName" class="px-4 py-3 rounded-xl border bg-slate-50 font-semibold outline-none">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="px-4 py-3 rounded-xl border outline-none">
                <select id="bookTimeSelect" class="px-4 py-3 rounded-xl border outline-none"></select>
            </div>
            <button id="btnSave" class="w-full bg-slate-900 text-white font-black py-4 rounded-xl">예약 확정하기</button>
        </section>

        <div id="calendar" class="mb-8"></div>

        <section id="adminPanel" class="bg-orange-50 p-6 rounded-2xl border border-orange-200 mb-10">
            <h2 class="text-sm font-black text-orange-700 mb-4 uppercase tracking-wider">User Management</h2>
            <div id="userList" class="space-y-2"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, addDoc, getDocs, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserData = null;

        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            for (let m of ['00', '30']) {
                const hh = String(h).padStart(2, '0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${m}`; opt.textContent = `${hh}:${m}`;
                timeSelect.appendChild(opt);
            }
        }

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'timeGridWeek',
            locale: 'ko',
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            displayEventTime: false,
            allDaySlot: false,
            eventContent: function(arg) {
                const room = arg.event.title.split(' | ')[0];
                const user = arg.event.title.split(' | ')[1];
                const timeStr = arg.event.extendedProps.shortTime;

                if (arg.view.type === 'dayGridMonth') {
                    return { html: `
                        <div class="month-event-box">
                            <span class="month-time">${timeStr}</span>
                            <span class="month-room">${room}</span>
                        </div>` 
                    };
                } else {
                    return { html: `
                        <div class="week-event-box">
                            <span class="week-room">${room}</span>
                            <span class="week-user">👤 ${user}</span>
                        </div>` 
                    };
                }
            },
            eventClick: async function(info) {
                const owner = info.event.extendedProps.user;
                if (auth.currentUser?.email === owner || currentUserData?.isAdmin) {
                    if (confirm(`예약을 삭제하시겠습니까?`)) {
                        await deleteDoc(doc(db, "reservations", info.event.id));
                    }
                }
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authForm').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('bookingSection').style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0];
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if(snap.exists()) {
                        currentUserData = snap.data();
                        if(currentUserData.isAdmin) document.getElementById('adminPanel').style.display = 'block';
                    }
                });
            } else {
                document.getElementById('authForm').style.display = 'block';
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('bookingSection').style.display = 'none';
            }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        document.getElementById('btnSignup').onclick = async () => {
            const u = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            await setDoc(doc(db, "users", u.user.uid), { email: emailInput.value, approved: false, isAdmin: false });
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTimeSelect').value;
            if(!date) return alert("날짜 선택!");
            await addDoc(collection(db, "reservations"), { 
                user: auth.currentUser.email, room, time: `${date}T${time}`, shortTime: time 
            });
            alert("확정!");
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({
                    id: doc.id,
                    title: `${d.room} | ${d.user.split('@')[0]}`,
                    start: d.time,
                    backgroundColor: getRoomColor(d.room),
                    extendedProps: { user: d.user, shortTime: d.shortTime }
                });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#ef4444", "제빵실": "#f59e0b", "공작실": "#10b981", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room] || "#64748b";
        }
    </script>
</body>
</html>
