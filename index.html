        /* 캘린더 한글 및 디자인 */

        .fc-button { padding: 8px 12px !important; font-size: 0.85rem !important; font-weight: 800 !important; border-radius: 12px !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .fc-timegrid-slot { height: 70px !important; }
        .fc-day-header a { text-decoration: none !important; color: #64748b !important; font-weight: 800; }
        
        /* 이벤트 칩 */
        .event-chip { font-size: 10px; padding: 5px; border-radius: 6px; color: white; font-weight: 700; }
        .bg-band { background-color: #10b981 !important; }
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; }
        .bg-study { background-color: #3b82f6 !important; }

        #calendar { background: white; border-radius: 24px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        @media (max-width: 768px) { .modal-overlay { align-items: flex-end; } .modal-content { border-radius: 32px 32px 0 0 !important; width: 100% !important; margin: 0 !important; } }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 16px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 40px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }

                        <span class="text-sm font-black text-white">수칙을 모두 지키겠습니다.</span>
                    </label>
                </div>

                <div class="flex gap-3">
                    <button id="closeBooking" class="flex-1 py-4 text-slate-400 font-bold">닫기</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-4 bg-slate-200 text-white font-black rounded-2xl shadow-lg transition-all">예약 확정</button>
                </div>
            </div>
        </div>

            <div class="modal-content w-[90%] bg-white max-w-sm p-10 rounded-[40px] text-center shadow-2xl">
                <div class="text-5xl mb-4">✅</div>
                <h3 class="font-black text-2xl text-slate-800 mb-2">예약 완료!</h3>
                <p id="successRoomInfo" class="text-sm text-slate-400 font-bold mb-8"></p>
                <button id="closeSuccess" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg">확인</button>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-slate-50 max-w-2xl p-8 rounded-[40px] shadow-2xl max-h-[90vh] overflow-y-auto border-t-[12px] border-indigo-600">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="font-black text-2xl text-indigo-950">운영자 관리 모드</h3>
                    <button id="closeAdmin" class="w-10 h-10 bg-white rounded-full text-slate-400 font-black">✕</button>

                <div class="mb-10">
                    <h4 class="font-black text-xs text-slate-400 mb-4 px-1 uppercase tracking-widest">실시간 예약 현황 <span id="adminTotalCount" class="ml-2 bg-indigo-600 text-white px-2 py-0.5 rounded-full">0건</span></h4>

                    <div class="flex gap-2 mb-6">
                        <input type="email" id="blackInput" placeholder="차단할 이메일 입력" class="flex-1 p-4 border-2 border-slate-50 rounded-2xl text-sm font-bold bg-slate-50 outline-none">
                        <button id="btnBlackAdd" class="px-6 bg-indigo-600 text-white font-black rounded-2xl shadow-lg">차단 등록</button>
