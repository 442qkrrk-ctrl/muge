<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.3.5)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; padding: 10px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900 !important; color: #065f46; }
        .fc-button { padding: 6px 10px !important; font-size: 0.8rem !important; font-weight: 800 !important; border-radius: 10px !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .event-chip { font-size: 10px; padding: 4px; border-radius: 6px; color: white; font-weight: 700; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .bg-band { background-color: #10b981 !important; } .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; } .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }
        #calendar { background: white; border-radius: 20px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 500px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        #toast { visibility: hidden; min-width: 200px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; font-size: 13px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        .fc-col-header-cell-cushion, .fc-daygrid-day-number { cursor: pointer !important; color: #1e293b !important; text-decoration: none !important; font-weight: 700; }
        /* 모바일 세로 길이 최적화 */
        @media (max-width: 768px) {
            #calendar { height: calc(100vh - 120px) !important; }
        }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-4 px-1">
            <div>
                <h1 class="text-xl font-black text-emerald-900">무계행복마을학교</h1>
                <p class="text-[10px] font-bold text-emerald-600 tracking-tighter">시설 예약 관리 시스템 (v1.3.5)</p>
            </div>
            <div class="flex gap-2 items-center">
                <button id="btnAdminOpen" class="hidden text-[10px] bg-indigo-600 text-white px-3 py-2 rounded-xl font-black shadow-lg">관리자 모드</button>
                <div id="loginInfo" class="text-right hidden">
                    <span id="userNick" class="text-[11px] font-black block text-slate-700"></span>
                    <button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button>
                </div>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-white max-w-sm p-6 rounded-[30px] shadow-2xl">
                <h3 id="modalDateDisplay" class="font-black text-lg text-center mb-6 text-slate-800">예약 신청</h3>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="text-[14px] font-bold text-slate-400 ml-1">시간 선택</label>
                        <select id="modalTime" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400"></select>
                    </div>
                    <div>
                        <label class="text-[14px] font-bold text-slate-400 ml-1">시설 선택</label>
                        <select id="modalRoom" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                </div>
                <div class="bg-slate-900 p-5 rounded-2xl mb-6 shadow-xl">
                    <h4 class="text-[12px] font-black text-emerald-400 mb-2">📋 필수 이용 수칙</h4>
                    <ul class="text-[14px] text-slate-300 space-y-1 font-medium mb-4">
                        <li>• 퇴실 시 전등 및 냉난방기를 반드시 끕니다.</li>
                        <li>• 사용한 비품은 제자리에, 쓰레기는 수거합니다.</li>
                        <li>• 시설 훼손 시 원상 복구의 책임이 있습니다.</li>
                    </ul>
                    <label class="flex items-center gap-3 cursor-pointer pt-3 border-t border-slate-800">
                        <input type="checkbox" id="agreeRules" class="w-5 h-5 accent-emerald-500">
                        <span class="text-xs font-black text-white">수칙을 모두 확인했으며 준수하겠습니다.</span>
                    </label>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('bookingModal').style.display='none'" class="flex-1 py-3 text-slate-400 font-bold">취소</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl">예약 확정</button>
                </div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-[95%] bg-slate-50 max-w-2xl p-6 rounded-[30px] shadow-2xl max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-xl text-indigo-950">운영 대시보드</h3>
                    <button onclick="document.getElementById('adminModal').style.display='none'" class="text-slate-400 font-bold">닫기</button>
                </div>
                <div class="mb-8">
                    <h4 class="font-black text-xs text-slate-400 mb-3 px-1">전체 예약 현황 <span id="adminCount" class="text-indigo-600">0</span></h4>
                    <div id="adminList" class="space-y-2"></div>
                </div>
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <h4 class="font-black text-xs text-slate-400 mb-4 px-1">블랙리스트 관리</h4>
                    <div class="flex gap-2 mb-4">
                        <input type="email" id="blackInput" placeholder="이메일 입력" class="flex-1 p-3 border-2 border-slate-50 rounded-xl text-sm font-bold bg-slate-50 outline-none focus:border-indigo-400">
                        <button id="btnBlackAdd" class="px-4 bg-indigo-600 text-white font-black rounded-xl text-sm">등록</button>
                    </div>
                    <div id="blackList" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div id="authModal" class="modal-overlay" style="display: flex;">
            <div class="modal-content w-[90%] bg-white max-w-sm p-8 rounded-[30px] shadow-2xl text-center">
                <h3 class="font-black text-xl mb-6">마을학교 로그인</h3>
                <button id="btnGoogle" class="w-full py-3 mb-4 border-2 rounded-xl font-bold flex justify-center items-center gap-2"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">구글 로그인</button>
                <input type="email" id="email" placeholder="이메일" class="w-full p-3 mb-2 bg-slate-50 rounded-xl outline-none text-sm font-bold">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full p-3 mb-6 bg-slate-50 rounded-xl outline-none text-sm font-bold">
                <button id="btnLogin" class="w-full py-3 bg-emerald-600 text-white font-black rounded-xl">로그인</button>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        const ADMIN_EMAILS = ["442qkrrk@gmail.com", "nyamachoma@naver.com"];
        const isAdmin = (email) => ADMIN_EMAILS.includes(email);

        let currentDay = "";
        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 19; h++) { ['00', '30'].forEach(m => { const hh = String(h).padStart(2, '0'); modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`)); }); }

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        function openBookingModal(dateInput) {
            if (!auth.currentUser) { document.getElementById('authModal').style.display='flex'; return; }
            
            const now = new Date();
            const selectedDate = (typeof dateInput === 'string') ? new Date(dateInput) : dateInput;
            
            // [v1.3.5 수정] 시간대 오차 방지를 위해 현지 시간 기준으로 날짜 문자열 추출
            const year = selectedDate.getFullYear();
            const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const day = String(selectedDate.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const timeStr = (selectedDate.getHours() !== 0 || selectedDate.getMinutes() !== 0) 
                            ? selectedDate.toTimeString().substring(0, 5) 
                            : "09:00";

            const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const targetOnly = new Date(year, selectedDate.getMonth(), selectedDate.getDate());
            
            if (targetOnly < todayOnly) {
                showToast("🚫 지난 날짜는 예약할 수 없습니다.");
                return;
            }
            if (selectedDate < now && (selectedDate.getHours() !== 0 || selectedDate.getMinutes() !== 0)) {
                showToast("🚫 이미 지난 시간입니다.");
                return;
            }

            currentDay = dateStr;
            const agreeCheck = document.getElementById('agreeRules');
            const confirmBtn = document.getElementById('btnConfirm');
            agreeCheck.checked = false; 
            confirmBtn.disabled = true;
            confirmBtn.className = "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl";

            document.getElementById('modalDateDisplay').innerText = `${currentDay} 예약`;
            document.getElementById('modalTime').value = timeStr;
            document.getElementById('bookingModal').style.display = 'flex';
            if(window.calendarObj) window.calendarObj.unselect();
        }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            selectable: true,
            allDaySlot: false,
            navLinks: true, 
            height: 'auto', // [v1.3.5 추가] 콘텐츠에 맞게 높이 조절
            slotMinTime: '09:00:00',
            slotMaxTime: '20:00:00',
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek' },
            buttonText: { today: '오늘', month: '월', week: '주' },
            
            navLinkDayClick: function(date) { openBookingModal(date); },
            select: function(info) { openBookingModal(info.start); },
            dateClick: function(info) { openBookingModal(info.date); },

            eventContent: (arg) => {
                const nick = (arg.event.extendedProps.user || "").split('@')[0];
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band";
                else if(arg.event.title.includes("제빵")) cls = "bg-bread";
                else if(arg.event.title.includes("공작")) cls = "bg-work";
                else if(arg.event.title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${arg.event.title}</div><div style="font-size:7px; opacity:0.8;">[${nick}]</div></div>` };
            },
            eventClick: async (info) => {
                if (auth.currentUser && (auth.currentUser.email === info.event.extendedProps.user || isAdmin(auth.currentUser.email))) {
                    if (confirm(`취소하시겠습니까?`)) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("✅ 취소됨"); }
                } else { showToast("본인 예약만 취소 가능합니다."); }
            }
        });
        window.calendarObj = calendar;

        window.admDel = async (id) => { if(confirm('강제 취소하시겠습니까?')) await deleteDoc(doc(db, "reservations", id)); };
        window.admUnblack = async (id) => { if(confirm('해제하시겠습니까?')) await deleteDoc(doc(db, "blacklist", id)); };

        function loadAdmin() {
            onSnapshot(collection(db, "reservations"), (snap) => {
                const list = document.getElementById('adminList');
                document.getElementById('adminCount').innerText = snap.size;
                list.innerHTML = '';
                snap.forEach(s => {
                    const d = s.data();
                    list.innerHTML += `<div class="bg-white p-3 rounded-xl flex justify-between items-center text-xs border border-slate-100 shadow-sm">
                        <div><div class="font-black text-slate-800">${d.time.replace('T',' ')} [${d.room}]</div><div class="text-slate-400 font-bold">${d.user}</div></div>
                        <button onclick="admDel('${s.id}')" class="text-red-500 font-black px-2">취소</button>
                    </div>`;
                });
            });
            onSnapshot(collection(db, "blacklist"), (snap) => {
                const list = document.getElementById('blackList'); list.innerHTML = '';
                snap.forEach(s => {
                    list.innerHTML += `<div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-600">${s.data().email}</span>
                        <button onclick="admUnblack('${s.id}')" class="text-indigo-400 font-black px-2">해제</button>
                    </div>`;
                });
            });
        }

        onSnapshot(collection(db, "reservations"), (snap) => {
            const evs = [];
            snap.forEach(s => { const d = s.data(); evs.push({ id: s.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime, user: d.user } }); });
            calendar.removeAllEvents(); calendar.addEventSource(evs);
        });

        document.getElementById('btnConfirm').onclick = async () => {
            const bSnap = await getDocs(query(collection(db, "blacklist"), where("email", "==", auth.currentUser.email)));
            if (!bSnap.empty) { showToast("🚫 차단된 사용자입니다."); return; }
            const finalTime = `${currentDay}T${document.getElementById('modalTime').value}`;
            if (new Date(finalTime) < new Date()) { showToast("🚫 지난 시간은 예약할 수 없습니다."); return; }
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room: document.getElementById('modalRoom').value, time: finalTime, shortTime: document.getElementById('modalTime').value });
            document.getElementById('bookingModal').style.display = 'none';
        };

        document.getElementById('btnBlackAdd').onclick = async () => {
            const val = document.getElementById('blackInput').value.trim();
            if(val) await addDoc(collection(db, "blacklist"), { email: val });
            document.getElementById('blackInput').value = '';
        };

        document.getElementById('btnAdminOpen').onclick = () => { document.getElementById('adminModal').style.display='flex'; loadAdmin(); };
        document.getElementById('agreeRules').onchange = (e) => {
            const b = document.getElementById('btnConfirm'); b.disabled = !e.target.checked;
            b.className = e.target.checked ? "flex-[2] py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg" : "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl";
        };

        onAuthStateChanged(auth, (u) => {
            document.getElementById('authModal').style.display = u ? 'none' : 'flex';
            document.getElementById('loginInfo').classList.toggle('hidden', !u);
            if(u) {
                document.getElementById('userNick').innerText = u.email.split('@')[0] + "님";
                if(isAdmin(u.email)) document.getElementById('btnAdminOpen').classList.remove('hidden');
                else document.getElementById('btnAdminOpen').classList.add('hidden');
            }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, email.value, pw.value);
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        calendar.render();
    </script>
</body>
</html>
