<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        #bookingForm, #userInfo { display: none; }
        
        /* 캘린더 날짜 클릭 시 나타날 예약 바 스타일 */
        .booking-bar {
            position: sticky;
            top: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 3px solid #10b981;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .booking-bar.active { transform: translateY(0); opacity: 1; display: block; }

        .big-input {
            height: 50px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            width: 100%;
        }
        
        #selectedDateDisplay { background: #ecfdf5; color: #065f46; border-color: #10b981; }

        /* 캘린더 커스텀 */
        .fc { background: white; padding: 15px; border-radius: 24px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .fc-daygrid-day { cursor: pointer !important; }
        .fc-daygrid-day:hover { background-color: #f0fdf4 !important; }
        .fc-toolbar-title { font-weight: 900; color: #1e293b; }
        
        .fc-event { border: none !important; padding: 2px !important; }
        .event-card { font-size: 10px; font-weight: 800; border-radius: 4px; padding: 2px 4px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-emerald-700">무계마을학교 🏫</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-xs font-bold text-slate-400"></span>
                <button id="btnLogout" class="text-xs text-red-400 font-bold ml-2">로그아웃</button>
            </div>
        </header>

        <section id="bookingForm" class="booking-bar p-5 rounded-3xl mb-8">
            <div class="flex flex-col md:flex-row gap-3 items-center">
                <div class="flex-1 w-full">
                    <label class="text-[10px] font-black text-emerald-600 ml-1">SELECTED DATE</label>
                    <input type="text" id="selectedDateDisplay" class="big-input" readonly>
                </div>
                <div class="flex-1 w-full">
                    <label class="text-[10px] font-black text-emerald-600 ml-1">SELECT TIME</label>
                    <select id="timeSelect" class="big-input bg-slate-800 text-white"></select>
                </div>
                <div class="flex-1 w-full">
                    <label class="text-[10px] font-black text-emerald-600 ml-1">SELECT ROOM</label>
                    <select id="roomSelect" class="big-input">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                </div>
                <div class="w-full md:w-auto pt-4 md:pt-4">
                    <button id="btnConfirm" class="w-full md:w-32 h-[50px] bg-emerald-600 text-white font-black rounded-xl shadow-lg hover:bg-emerald-700">예약확정</button>
                </div>
            </div>
        </section>

        <div id="loginNotice" class="text-center py-20 bg-white rounded-3xl shadow-sm border mb-6">
            <p class="font-bold text-slate-400 mb-4">로그인 후 달력의 날짜를 클릭하여 예약하세요!</p>
            <button onclick="location.reload()" class="bg-emerald-600 text-white px-8 py-3 rounded-full font-bold">로그인/새로고침</button>
        </div>

        <div id="calendar"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const timeSelect = document.getElementById('timeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let currentDay = "";

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
            dateClick: function(info) {
                if (!auth.currentUser) return alert("로그인이 필요합니다!");
                
                currentDay = info.dateStr;
                const parts = currentDay.split('-');
                document.getElementById('selectedDateDisplay').value = `${parts[1]}월 ${parts[2]}일 (선택됨)`;
                
                // 예약 폼 활성화 및 스크롤
                const form = document.getElementById('bookingForm');
                form.style.display = 'block';
                setTimeout(() => form.classList.add('active'), 10);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            eventContent: function(arg) {
                return { html: `<div class="event-card bg-emerald-100 text-emerald-800 border-l-4 border-emerald-500">${arg.event.extendedProps.shortTime} ${arg.event.title}</div>` };
            },
            eventClick: async function(info) {
                if (confirm('이 예약을 삭제하시겠습니까?')) await deleteDoc(doc(db, "reservations", info.event.id));
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('loginNotice').style.display = 'none';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님";
            } else {
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('loginNotice').style.display = 'block';
                document.getElementById('bookingForm').classList.remove('active');
            }
        });

        document.getElementById('btnConfirm').onclick = async () => {
            const room = document.getElementById('roomSelect').value;
            const time = timeSelect.value;
            await addDoc(collection(db, "reservations"), {
                user: auth.currentUser.email,
                room,
                time: `${currentDay}T${time}`,
                shortTime: time
            });
            alert("🎉 예약이 완료되었습니다!");
            document.getElementById('bookingForm').classList.remove('active');
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        });
    </script>
</body>
</html>
