<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.1.6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; padding: 12px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900; color: #1e293b; }
        .fc-button { padding: 6px 10px !important; font-size: 0.8rem !important; font-weight: 800 !important; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .fc-timegrid-slot { height: 70px !important; } 
        .fc-day-header a { text-decoration: none !important; color: #475569 !important; }
        
        .event-chip { font-size: 10px; padding: 4px; border-radius: 4px; color: white; font-weight: 700; line-height: 1.2; }
        .bg-band { background-color: #10b981 !important; }
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; }
        .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }

        #calendar { background: white; border-radius: 16px; padding: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); z-index: 9999; justify-content: center; align-items: center; }
        @media (max-width: 768px) { .modal-overlay { align-items: flex-end; } .modal-content { border-radius: 24px 24px 0 0 !important; } }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1100px] mx-auto">
        <header class="flex justify-between items-center py-4 px-2">
            <h1 class="text-xl font-black text-emerald-800">무계행복마을학교 예약</h1>
            <div class="flex gap-4 items-center">
                <span id="userStatus" class="text-[10px] font-bold text-slate-400"></span>
                <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="authModal" class="modal-overlay" style="display: flex;">
            <div class="modal-content w-full bg-white max-w-md p-8 rounded-3xl shadow-2xl text-center mx-4">
                <h3 class="font-black text-2xl mb-2 text-emerald-900">환영합니다!</h3>
                <p class="text-sm text-slate-400 mb-6">시설 예약을 위해 로그인해 주세요.</p>
                <button id="btnGoogle" class="w-full py-4 mb-4 bg-white border-2 flex items-center justify-center gap-3 rounded-2xl font-bold hover:bg-slate-50 transition-all"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> 구글 로그인</button>
                <div class="flex items-center my-4 opacity-30"><hr class="flex-grow"> <span class="mx-3 text-xs">OR</span> <hr class="flex-grow"></div>
                <input type="email" id="email" placeholder="이메일" class="w-full p-4 mb-3 border-2 rounded-2xl bg-slate-50 outline-none focus:border-emerald-500">
                <input type="password" id="pw" placeholder="비밀번호" class="w-full p-4 mb-6 border-2 rounded-2xl bg-slate-50 outline-none focus:border-emerald-500">
                <div class="flex gap-2">
                    <button id="btnLogin" class="flex-1 py-4 bg-emerald-600 text-white font-black rounded-2xl">로그인</button>
                    <button id="btnJoin" class="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl">회원가입</button>
                </div>
            </div>
        </div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-md p-6 rounded-3xl shadow-2xl mx-4">
                <h3 id="modalDateDisplay" class="font-black text-lg mb-4 text-center text-emerald-900">시설 예약 설정</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <select id="modalTime" class="p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50 text-sm focus:border-emerald-500 outline-none"></select>
                    <select id="modalRoom" class="p-4 border-2 border-slate-100 rounded-xl font-bold bg-slate-50 text-sm focus:border-emerald-500 outline-none">
                        <option value="밴드실">🎸 밴드실</option>
                        <option value="제빵실">🍞 제빵실</option>
                        <option value="공작실">🔨 공작실</option>
                        <option value="강의실">📖 강의실</option>
                        <option value="다목적실">✨ 다목적실</option>
                    </select>
                </div>

                <div class="bg-amber-50 p-4 rounded-2xl mb-6 border border-amber-100">
                    <h4 class="text-xs font-black text-amber-800 mb-2">⚠️ 이용 수칙 (필수 확인)</h4>
                    <ul class="text-[11px] text-amber-900 space-y-1 mb-3">
                        <li>• 퇴실 시 모든 전등 및 냉난방기를 껐습니까?</li>
                        <li>• 사용한 비품은 제자리에 정리했습니까?</li>
                        <li>• 발생한 쓰레기는 모두 수거했습니까?</li>
                    </ul>
                    <label class="flex items-center gap-2 cursor-pointer pt-2 border-t border-amber-200">
                        <input type="checkbox" id="agreeRules" class="w-4 h-4 accent-emerald-600">
                        <span class="text-xs font-bold text-emerald-900">위 수칙을 준수할 것을 약속합니다.</span>
                    </label>
                </div>

                <div class="flex gap-2">
                    <button id="closeBooking" class="flex-1 py-4 text-slate-400 font-bold">취소</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-4 bg-slate-200 text-white font-black rounded-xl cursor-not-allowed transition-all">예약 확정</button>
                </div>
            </div>
        </div>

        <div id="successModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-md p-8 rounded-3xl shadow-2xl text-center mx-4">
                <div class="text-5xl mb-4">🎉</div>
                <h3 class="font-black text-2xl text-emerald-700">예약 완료!</h3>
                <p id="successRoomInfo" class="text-slate-500 font-bold mt-2 mb-6"></p>
                <button id="closeSuccess" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg">확인했습니다</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 21; h++) { ['00', '30'].forEach(m => { const hh = String(h).padStart(2, '0'); modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`)); }); }

        let currentDay = "";
        const authModal = document.getElementById('authModal');
        const bookingModal = document.getElementById('bookingModal');
        const agreeRules = document.getElementById('agreeRules');
        const btnConfirm = document.getElementById('btnConfirm');

        // 인증 상태에 따른 모달 제어
        onAuthStateChanged(auth, (u) => {
            if (u) { 
                authModal.style.display = 'none'; 
                document.getElementById('userStatus').innerText = (u.displayName || u.email.split('@')[0]) + "님";
            } else { 
                authModal.style.display = 'flex'; 
                bookingModal.style.display = 'none'; // 로그아웃 시 예약창 강제 닫기
            }
        });

        // 체크박스 동의 제어
        agreeRules.addEventListener('change', (e) => {
            if (e.target.checked) {
                btnConfirm.disabled = false;
                btnConfirm.classList.replace('bg-slate-200', 'bg-emerald-600');
                btnConfirm.classList.remove('cursor-not-allowed');
            } else {
                btnConfirm.disabled = true;
                btnConfirm.classList.replace('bg-emerald-600', 'bg-slate-200');
                btnConfirm.classList.add('cursor-not-allowed');
            }
        });

        // 버튼 이벤트
        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, email.value, pw.value).catch(e => showToast("로그인 실패"));
        document.getElementById('btnJoin').onclick = () => createUserWithEmailAndPassword(auth, email.value, pw.value).catch(e => showToast("가입 실패"));
        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        document.getElementById('closeSuccess').onclick = () => document.getElementById('successModal').style.display = 'none';
        document.getElementById('closeBooking').onclick = () => bookingModal.style.display = 'none';

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko', height: 'auto', slotMinTime: '09:00:00', slotMaxTime: '22:00:00',
            selectable: true, navLinks: true,
            buttonText: { today: '오늘', month: '월', week: '주' },
            headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek' },
            
            navLinkDayClick: (date) => {
                if (!auth.currentUser) { authModal.style.display = 'flex'; return; }
                currentDay = date.toLocaleDateString('en-CA');
                openBookingModal(currentDay);
            },
            select: (info) => {
                if (!auth.currentUser) { authModal.style.display = 'flex'; return; }
                currentDay = info.startStr.split('T')[0];
                if (info.startStr.includes('T')) modalTime.value = info.startStr.split('T')[1].substring(0, 5);
                openBookingModal(currentDay);
                calendar.unselect();
            },
            eventContent: (arg) => {
                const title = arg.event.title;
                const nick = arg.event.extendedProps.user ? arg.event.extendedProps.user.split('@')[0] : "익명";
                let cls = "bg-multi";
                if(title.includes("밴드")) cls = "bg-band";
                else if(title.includes("제빵")) cls = "bg-bread";
                else if(title.includes("공작")) cls = "bg-work";
                else if(title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${title}</div><div style="font-size: 8px; opacity: 0.8;">[${nick}]</div></div>` };
            },
            eventClick: async (info) => {
                if (!auth.currentUser) return;
                if (auth.currentUser.email !== info.event.extendedProps.user && auth.currentUser.email !== "442qkrrk@gmail.com") { showToast("❌ 권한 없음"); return; }
                if (confirm('취소하시겠습니까?')) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("✅ 취소됨"); }
            }
        });
        calendar.render();

        function openBookingModal(day) {
            agreeRules.checked = false;
            btnConfirm.disabled = true;
            btnConfirm.classList.replace('bg-emerald-600', 'bg-slate-200');
            btnConfirm.classList.add('cursor-not-allowed');
            document.getElementById('modalDateDisplay').innerText = day + " 예약";
            bookingModal.style.display = 'flex';
        }

        btnConfirm.onclick = async () => {
            const room = document.getElementById('modalRoom').value;
            const fullTime = `${currentDay}T${modalTime.value}`;
            btnConfirm.disabled = true;
            try {
                const q = query(collection(db, "reservations"), where("room", "==", room));
                const snap = await getDocs(q);
                let overlap = false;
                snap.forEach(d => {
                    if (d.data().time.startsWith(currentDay)) {
                        const s = new Date(d.data().time);
                        const target = new Date(fullTime);
                        if (Math.abs(s - target) < 3600000) overlap = true;
                    }
                });
                if (overlap) { showToast("⚠️ 중복 예약 불가"); }
                else {
                    await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room: room, time: fullTime, shortTime: modalTime.value });
                    bookingModal.style.display = 'none';
                    document.getElementById('successRoomInfo').innerText = `${currentDay} ${room}`;
                    document.getElementById('successModal').style.display = 'flex';
                }
            } catch (e) { showToast("오류 발생"); }
            btnConfirm.disabled = false;
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime, user: d.user } });
            });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });
    </script>
</body>
</html>
