<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 예약시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fdfbf7; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        #bookingSection, #userInfo, #adminUserList { display: none; }
        
        /* [v5.5] 낭낭하고 명확한 입력 UI */
        .big-input-box {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            text-align: center;
        }
        .big-input-box:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        
        /* 선택된 날짜 표시 전용 */
        .date-display {
            background: #f8fafc;
            color: #64748b;
            border: 3px dashed #cbd5e1;
        }

        /* 캘린더 타이틀 (반응형 1-2줄) */
        .fc-toolbar-title { display: flex !important; flex-direction: column !important; align-items: center !important; line-height: 1.1 !important; font-size: 0.85rem !important; font-weight: 800; color: #065f46; }
        .fc-toolbar-title::after { content: attr(data-month); font-size: 1.25rem !important; display: block; margin-top: 2px; }

        @media (min-width: 768px) {
            .max-w-md { max-width: 1100px !important; }
            .fc-toolbar-title { flex-direction: row !important; gap: 8px; font-size: 2rem !important; }
            .fc-toolbar-title::after { content: attr(data-month); font-size: 2rem !important; margin-top: 0; }
        }

        .fc { background: white; padding: 5px; border-radius: 1.25rem; border: 1px solid #e2e8f0; }
        .month-event-box { display: flex; flex-direction: column; width: 100%; padding: 2px 1px; line-height: 1.1; }
        .month-time { font-size: 8px; font-weight: 900; }
        .month-room { font-size: 10px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fc-button-primary { background-color: #065f46 !important; border-color: #065f46 !important; }
        button:active { scale: 0.96; transition: 0.1s; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-md mx-auto px-3 pt-6 transition-all">
        <header class="flex justify-between items-center mb-5 px-1">
            <h1 class="text-xl md:text-3xl font-black text-emerald-700">무계행복마을학교</h1>
            <div id="userInfo" class="text-right">
                <span id="userDisplay" class="text-[9px] md:text-sm font-bold block text-slate-400"></span>
                <button id="btnLogout" class="text-[9px] md:text-sm text-red-400 font-bold">로그아웃</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-5 rounded-2xl shadow-sm border mb-4">
            <div class="flex flex-col md:flex-row gap-2 mb-2">
                <input type="email" id="emailInput" placeholder="이메일" class="big-input-box text-sm">
                <input type="password" id="passwordInput" placeholder="비번" class="big-input-box text-sm">
            </div>
            <button id="btnLogin" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-2">로그인</button>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-xl border-t-8 border-t-emerald-500 mb-8">
            <h2 class="text-center font-black text-slate-400 text-xs mb-4 uppercase tracking-widest">Selected Reservation</h2>
            
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <label class="absolute -top-2 left-4 bg-white px-2 text-[10px] font-black text-emerald-600">DATE</label>
                    <input type="text" id="displayDate" class="big-input-box date-display" readonly placeholder="달력에서 날짜를 선택하세요">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <label class="absolute -top-2 left-4 bg-white px-2 text-[10px] font-black text-emerald-600">TIME</label>
                        <select id="bookTimeSelect" class="big-input-box bg-slate-800 text-white border-slate-800"></select>
                    </div>
                    <div class="relative">
                        <label class="absolute -top-2 left-4 bg-white px-2 text-[10px] font-black text-emerald-600">ROOM</label>
                        <select id="roomName" class="big-input-box">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                </div>
            </div>
            <button id="btnSave" class="w-full mt-6 bg-emerald-600 text-white font-black py-5 rounded-2xl shadow-lg text-lg">이 일정으로 예약 확정</button>
        </section>

        <div id="calendar" class="mb-10"></div>

        <div id="adminUserList" class="bg-white p-5 rounded-2xl shadow-sm border border-orange-200">
            <h3 class="font-black text-orange-600 mb-3 flex items-center gap-2 text-sm">📢 실시간 가입자 명단</h3>
            <ul id="userUl" class="text-[11px] md:text-sm space-y-2 divide-y divide-orange-50"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            authDomain: "muge-43e73.firebaseapp.com",
            projectId: "muge-43e73",
            storageBucket: "muge-43e73.firebasestorage.app",
            messagingSenderId: "356856775293",
            appId: "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 시간 옵션 (09:00~21:30)
        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 21; h++) {
            ['00', '30'].forEach(m => {
                const hh = String(h).padStart(2, '0');
                timeSelect.add(new Option(`${hh}:${m}`, `${hh}:${m}`));
            });
        }

        let selectedFullDate = ""; // 실제 저장용 날짜 변수

        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: window.innerWidth < 768 ? 'dayGridMonth' : 'timeGridWeek',
            locale: 'ko',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            selectable: true,
            // [v5.5] 날짜 클릭 시 명확하게 입력창에 뿌려주기
            dateClick: function(info) {
                selectedFullDate = info.dateStr; // "2026-02-14"
                const dateParts = selectedFullDate.split('-');
                document.getElementById('displayDate').value = `${dateParts[0]}년 ${dateParts[1]}월 ${dateParts[2]}일`;
                // 터치 후 예약 섹션으로 부드럽게 스크롤
                document.getElementById('bookingSection').scrollIntoView({ behavior: 'smooth' });
            },
            datesSet: function() {
                const titleEl = document.querySelector('.fc-toolbar-title');
                if (titleEl) {
                    const parts = calendar.view.title.split(' ');
                    if(parts.length >= 2) { titleEl.innerText = parts[0]; titleEl.setAttribute('data-month', parts[1]); }
                }
            },
            eventContent: function(arg) {
                const room = arg.event.title;
                const timeStr = arg.event.extendedProps.shortTime;
                return { html: arg.view.type === 'dayGridMonth' ? `<div class="month-event-box"><span class="month-time">${timeStr}</span><span class="month-room">${room}</span></div>` : `<div class="p-1"><b class="text-[10px] md:text-sm text-white">${room}</b></div>` };
            },
            eventClick: async function(info) { if (confirm(`삭제하시겠습니까?`)) await deleteDoc(doc(db, "reservations", info.event.id)); }
        });
        calendar.render();

        onAuthStateChanged(auth, async (user) => {
            const ui = { auth: document.getElementById('authForm'), info: document.getElementById('userInfo'), book: document.getElementById('bookingSection'), admin: document.getElementById('adminUserList') };
            if (user) {
                ui.auth.style.display = 'none'; ui.info.style.display = 'block'; ui.book.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0] + "님";
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin) {
                    ui.admin.style.display = 'block';
                    onSnapshot(collection(db, "users"), (snap) => {
                        const userUl = document.getElementById('userUl'); userUl.innerHTML = "";
                        snap.forEach(doc => {
                            const d = doc.data();
                            const li = document.createElement('li'); li.className = "flex justify-between py-2 text-slate-600";
                            li.innerHTML = `<span>👤 ${d.email}</span><span class="text-[9px] text-slate-400">${d.joinedAt?.split('T')[0] || '이전'}</span>`;
                            userUl.appendChild(li);
                        });
                    });
                }
            } else { ui.auth.style.display = 'block'; ui.info.style.display = 'none'; ui.book.style.display = 'none'; ui.admin.style.display = 'none'; }
        });

        document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert("실패!"));
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        document.getElementById('btnSave').onclick = async () => {
            const room = document.getElementById('roomName').value;
            const time = timeSelect.value;
            if(!selectedFullDate) return alert("먼저 달력에서 날짜를 클릭해주세요! 👇");
            
            await addDoc(collection(db, "reservations"), { user: auth.currentUser.email, room, time: `${selectedFullDate}T${time}`, shortTime: time });
            alert(`✅ 예약 완료!\n${selectedFullDate} ${time} [${room}]`);
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const events = [];
            snap.forEach(doc => {
                const d = doc.data();
                events.push({ id: doc.id, title: d.room, start: d.time, backgroundColor: getRoomColor(d.room), extendedProps: { shortTime: d.shortTime } });
            });
            calendar.removeAllEvents(); calendar.addEventSource(events);
        });

        function getRoomColor(room) {
            const colors = { "밴드실": "#10b981", "제빵실": "#f59e0b", "공작실": "#6366f1", "강의실": "#3b82f6", "다목적실": "#8b5cf6" };
            return colors[room.trim()] || "#64748b";
        }
    </script>
</body>
</html>
