<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v9.8)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .fc-header-toolbar { display: flex !important; flex-wrap: wrap; justify-content: space-between !important; padding: 12px 5px !important; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 900; color: #1e293b; }
        .fc-button-primary { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; font-weight: 800 !important; }
        .fc-button-active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .fc-timegrid-slot { height: 70px !important; } 
        .fc-col-header-cell-cushion { width: 100%; padding: 10px 0 !important; display: block !important; cursor: pointer !important; text-decoration: none !important; color: inherit !important; }
        
        .event-chip { font-size: 10px; padding: 4px; border-radius: 4px; color: white; font-weight: 700; line-height: 1.2; }
        .bg-band { background-color: #10b981 !important; }
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; }
        .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }

        #calendar { background: white; border-radius: 16px; padding: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        @media (max-width: 768px) { .modal-overlay { align-items: flex-end; } .modal-content { border-radius: 24px 24px 0 0 !important; } }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1100px] mx-auto">
        <header class="flex justify-between items-center py-4 px-2">
            <h1 class="text-xl font-black text-emerald-800">무계행복마을학교 시설 예약 <span class="text-sm font-normal text-slate-400">(v9.8)</span></h1>
            <div class="flex gap-4 items-center">
                <span id="userStatus" class="text-[10px] font-bold text-slate-400"></span>
                <button id="btnLogout" class="text-xs font-bold text-red-400">로그아웃</button>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="successModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-md p-8 rounded-3xl shadow-2xl">
                <div class="text-center mb-6">
                    <div class="text-5xl mb-4">🎉</div>
                    <h3 class="font-black text-2xl text-emerald-700">예약 완료!</h3>
                    <p id="successRoomInfo" class="text-slate-500 font-bold mt-2"></p>
                </div>
                <div class="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 text-sm leading-relaxed mb-6">
                    <h4 class="font-black text-slate-800 mb-3 flex items-center gap-2">🚪 퇴실 전 안내 사항</h4>
                    <ul class="space-y-3 text-slate-600">
                        <li><strong>✅ 정리정돈:</strong> 사용하신 비품과 집기는 제자리에 두시고, 쓰레기는 반드시 수거해 주세요.</li>
                        <li><strong>✅ 전원 차단:</strong> 냉난방기(에어컨/히터)와 조명 등 모든 전자기기 전원을 꺼주세요.</li>
                        <li><strong>✅ 문단속:</strong> 퇴실 시 출입문이 완전히 잠겼는지 꼭 확인해 주시기 바랍니다.</li>
                    </ul>
                    <p class="mt-4 text-xs text-emerald-600 font-bold text-center">쾌적한 공간을 위해 협조해 주셔서 감사합니다.</p>
                </div>
                <button id="closeSuccess" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg shadow-emerald-100">확인했습니다</button>
            </div>
        </div>

        <div id="authModal" class="modal-overlay">...</div>
        <div id="bookingModal" class="modal-overlay">...</div>
    </div>

    <div id="toast"></div>

    <script type="module">
        // [Firebase 설정 및 초기화 동일]
        // ... (v9.7과 동일한 상단 로직)

        // v9.8에서 추가된 성공 모달 닫기 이벤트
        document.getElementById('closeSuccess').onclick = () => {
            document.getElementById('successModal').style.display = 'none';
        };

        // 예약 확정 로직 수정
        document.getElementById('btnConfirm').onclick = async () => {
            const btn = document.getElementById('btnConfirm');
            const selectedRoom = document.getElementById('modalRoom').value;
            const userEmail = auth.currentUser.email;
            const newStart = new Date(`${currentDay}T${modalTime.value}:00`);

            if (newStart < new Date()) {
                showToast("❌ 이미 지난 시간에는 예약할 수 없습니다.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "처리 중...";

            // [중복 체크 로직 동일]
            // ...

            try {
                await addDoc(collection(db, "reservations"), {
                    user: userEmail,
                    room: selectedRoom,
                    time: `${currentDay}T${modalTime.value}`,
                    shortTime: modalTime.value
                });
                
                // 예약 성공 시
                document.getElementById('bookingModal').style.display = 'none';
                document.getElementById('successRoomInfo').innerText = `${currentDay} [${selectedRoom}]`;
                document.getElementById('successModal').style.display = 'flex'; // 안내 팝업 노출
                
            } catch (e) {
                showToast("오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.innerText = "예약 확정";
            }
        };

        // [이하 캘린더 및 스냅샷 로직 v9.7과 동일]
    </script>
</body>
</html>
