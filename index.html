<script type="module">
    // ... (Firebase 초기화 및 기존 함수들은 동일) ...

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        locale: 'ko',
        allDaySlot: false,
        navLinks: true, // 날짜 클릭 가능하도록 설정
        slotMinTime: '09:00:00',
        slotMaxTime: '21:00:00',
        headerToolbar: { left: 'title', center: '', right: 'prev,next today dayGridMonth,timeGridWeek,dayView' },
        buttonText: { today: '오늘', month: '월', week: '주' },
        
        // [핵심 추가] 주 보기(Week)에서 상단 날짜 헤더 클릭 시 예약 모달 띄우기
        navLinkDayClick: function(date, jsEvent) {
            openBookingModal(date);
        },

        customButtons: { dayView: { text: '토', click: function() { 
            const current = calendar.getDate(); const sat = new Date(current); sat.setDate(current.getDate() + (6 - current.getDay())); 
            calendar.changeView('timeGridDay', sat); 
        } } },
        dayCellClassNames: (arg) => {
            const dStr = `${arg.date.getFullYear()}-${String(arg.date.getMonth() + 1).padStart(2, '0')}-${String(arg.date.getDate()).padStart(2, '0')}`;
            return holidayList.includes(dStr) ? ['holiday-cell'] : [];
        },
        // 시간표 빈 칸 클릭 시 작동
        dateClick: (info) => openBookingModal(info.date),
        
        eventClick: async (info) => { if (confirm('삭제하시겠습니까?')) { await deleteDoc(doc(db, "reservations", info.event.id)); showToast("삭제됨"); } },
        eventContent: (arg) => {
            const nick = (arg.event.extendedProps.user || "").split('@')[0];
            let cls = "bg-multi";
            if(arg.event.title.includes("밴드")) cls = "bg-band"; else if(arg.event.title.includes("제빵")) cls = "bg-bread"; 
            return { html: `<div class="event-chip ${cls}"><div>${arg.event.extendedProps.shortTime} ${arg.event.title}</div><div class="opacity-70">[${nick}]</div></div>` };
        }
    });

    // ... (나머지 checkConflict, checkReservedSlots, Firebase 리스너 로직은 v1.9.0과 동일 유지) ...

    calendar.render();
</script>
