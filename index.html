<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무계행복마을학교 시설 예약 (v1.5.1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* 모바일 달력 안 짤리게 강제 설정 */
        #calendar { 
            background: white; 
            border-radius: 20px; 
            padding: 5px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100% !important;
            max-width: 100% !important;
        }
        .fc { max-width: 100% !important; font-size: 0.85rem !important; }
        .fc-view-harness { width: 100% !important; }
        .fc-scrollgrid { border-radius: 15px !important; overflow: hidden !important; border: none !important; }
        
        /* 헤더 버튼 모바일 최적화 */
        .fc-header-toolbar { 
            display: flex !important; 
            flex-direction: column; 
            gap: 10px; 
            padding: 10px 0 !important; 
        }
        @media (min-width: 768px) {
            .fc-header-toolbar { flex-direction: row; }
        }

        .fc-toolbar-title { font-size: 1rem !important; font-weight: 900 !important; color: #065f46; }
        .fc-button { padding: 4px 8px !important; font-size: 0.75rem !important; font-weight: 800 !important; border-radius: 8px !important; }
        
        /* 이벤트 칩 디자인 개선 */
        .event-chip { 
            font-size: 9px; 
            padding: 2px 4px; 
            border-radius: 4px; 
            color: white; 
            font-weight: 700; 
            line-height: 1.2;
            margin-bottom: 1px;
        }
        .bg-band { background-color: #10b981 !important; } 
        .bg-bread { background-color: #f59e0b !important; }
        .bg-work { background-color: #6366f1 !important; } 
        .bg-study { background-color: #3b82f6 !important; }
        .bg-multi { background-color: #ec4899 !important; }

        /* 모달 모바일 대응 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
        #toast { visibility: hidden; min-width: 200px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 12px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; font-size: 13px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-[1000px] mx-auto">
        <header class="flex justify-between items-center mb-4 px-1">
            <div>
                <h1 class="text-lg font-black text-emerald-900 leading-tight">무계행복마을학교</h1>
                <p class="text-[10px] font-bold text-emerald-600 tracking-tighter">시설 예약 시스템 (v1.5.1)</p>
            </div>
            <div class="flex gap-2 items-center">
                <button id="btnAdminOpen" class="hidden text-[10px] bg-indigo-600 text-white px-3 py-2 rounded-xl font-black shadow-lg">관리자</button>
                <div id="loginInfo" class="text-right hidden">
                    <span id="userNick" class="text-[10px] font-black block text-slate-700 leading-none"></span>
                    <button id="btnLogout" class="text-[10px] text-red-400 font-bold">로그아웃</button>
                </div>
            </div>
        </header>

        <div id="calendar"></div>

        <div id="bookingModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-sm p-6 rounded-[25px] shadow-2xl overflow-y-auto max-h-[90vh]">
                <h3 id="modalDateDisplay" class="font-black text-lg text-center mb-5 text-slate-800">예약 신청</h3>
                <div class="space-y-4 mb-5">
                    <div>
                        <label class="text-xs font-bold text-slate-400 ml-1">시간 선택</label>
                        <select id="modalTime" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400"></select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 ml-1">시설 선택</label>
                        <select id="modalRoom" class="w-full p-3 border-2 border-slate-50 rounded-xl bg-slate-50 font-bold outline-none focus:border-emerald-400">
                            <option value="밴드실">🎸 밴드실</option>
                            <option value="제빵실">🍞 제빵실</option>
                            <option value="공작실">🔨 공작실</option>
                            <option value="강의실">📖 강의실</option>
                            <option value="다목적실">✨ 다목적실</option>
                        </select>
                    </div>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl mb-5 shadow-xl">
                    <h4 class="text-[11px] font-black text-emerald-400 mb-2">📋 필수 이용 수칙</h4>
                    <ul class="text-[12px] text-slate-300 space-y-1 font-medium mb-3">
                        <li>• 퇴실 시 전등 및 냉난방기 확인</li>
                        <li>• 비품 제자리 및 쓰레기 수거</li>
                        <li>• 시설 훼손 시 원상 복구 책임</li>
                    </ul>
                    <label class="flex items-center gap-3 cursor-pointer pt-3 border-t border-slate-800">
                        <input type="checkbox" id="agreeRules" class="w-5 h-5 accent-emerald-500">
                        <span class="text-[11px] font-black text-white">수칙을 확인했으며 준수하겠습니다.</span>
                    </label>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('bookingModal').style.display='none'" class="flex-1 py-3 text-slate-400 font-bold text-sm">취소</button>
                    <button id="btnConfirm" disabled class="flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl text-sm">예약 확정</button>
                </div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content w-full bg-slate-50 max-w-2xl p-6 rounded-[25px] shadow-2xl max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-lg text-indigo-950">운영 대시보드</h3>
                    <button onclick="document.getElementById('adminModal').style.display='none'" class="text-slate-400 font-bold">닫기</button>
                </div>
                <h4 class="font-black text-xs mb-2 text-indigo-600 uppercase tracking-widest">📅 예약 관리</h4>
                <div id="adminList" class="space-y-2 mb-8"></div>
                <h4 class="font-black text-xs mb-2 text-red-600 uppercase tracking-widest">🚫 차단 명단</h4>
                <div id="blackListArea" class="space-y-2"></div>
            </div>
        </div>

        <div id="authModal" class="modal-overlay">
            <div class="modal-content w-full bg-white max-w-sm p-8 rounded-[30px] shadow-2xl text-center">
                <h3 class="font-black text-xl mb-6">마을학교 로그인</h3>
                <button id="btnGoogle" class="w-full py-3 border-2 rounded-xl font-bold flex justify-center items-center gap-2">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">구글 로그인
                </button>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8", authDomain: "muge-43e73.firebaseapp.com", projectId: "muge-43e73", storageBucket: "muge-43e73.firebasestorage.app", messagingSenderId: "356856775293", appId: "1:356856775293:web:7ad8abaf66febd0a9be714" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAILS = ["442qkrrk@gmail.com", "nyamachoma@naver.com"];
        const isAdmin = (email) => ADMIN_EMAILS.includes(email);

        let currentDay = "";
        const modalTime = document.getElementById('modalTime');
        for (let h = 9; h <= 18; h++) { ['00', '30'].forEach(m => { if(h===18 && m==='30') return; const hh = String(h).padStart(2, '0'); modalTime.add(new Option(`${hh}:${m}`, `${hh}:${m}`)); }); }

        function showToast(m) { const t = document.getElementById("toast"); t.innerText = m; t.className = "show"; setTimeout(() => t.className = "", 3000); }

        function openBookingModal(date, clickedTime = null) {
            if (!auth.currentUser) { document.getElementById('authModal').style.display='flex'; return; }
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            currentDay = `${year}-${month}-${day}`;
            document.getElementById('modalDateDisplay').innerText = `${currentDay} 예약`;
            
            if (clickedTime) {
                const hh = String(clickedTime.getHours()).padStart(2, '0');
                const mm = clickedTime.getMinutes() < 30 ? "00" : "30";
                const t = `${hh}:${mm}`;
                if (modalTime.querySelector(`option[value="${t}"]`)) modalTime.value = t;
            }

            document.getElementById('agreeRules').checked = false;
            const btn = document.getElementById('btnConfirm');
            btn.disabled = true;
            btn.className = "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl text-sm";
            document.getElementById('bookingModal').style.display = 'flex';
        }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'ko',
            height: 'auto', // 높이 자동 조절로 짤림 방지
            handleWindowResize: true,
            expandRows: true,
            allDaySlot: false,
            slotMinTime: '09:00:00',
            slotMaxTime: '18:30:00',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,satView' },
            customButtons: {
                satView: {
                    text: '토',
                    click: function() {
                        const current = calendar.getDate();
                        const sat = new Date(current);
                        sat.setDate(current.getDate() + (6 - current.getDay()));
                        calendar.changeView('timeGridDay', sat);
                    }
                }
            },
            buttonText: { today: '오늘', month: '월', week: '주' },
            dateClick: (info) => openBookingModal(info.date, info.view.type !== 'dayGridMonth' ? info.date : null),
            eventContent: (arg) => {
                const nick = (arg.event.extendedProps.user || "").split('@')[0];
                let cls = "bg-multi";
                if(arg.event.title.includes("밴드")) cls = "bg-band";
                else if(arg.event.title.includes("제빵")) cls = "bg-bread";
                else if(arg.event.title.includes("공작")) cls = "bg-work";
                else if(arg.event.title.includes("강의")) cls = "bg-study";
                return { html: `<div class="event-chip ${cls}">[${arg.event.extendedProps.shortTime}] ${nick}</div>` };
            }
        });

        document.getElementById('btnConfirm').onclick = async () => {
            const email = auth.currentUser.email;
            const black = await getDocs(query(collection(db, "blacklist"), where("email", "==", email)));
            if (!black.empty) return showToast("🚫 예약 제한 계정입니다.");

            const time = document.getElementById('modalTime').value;
            const room = document.getElementById('modalRoom').value;
            const target = `${currentDay}T${time}`;

            const q = query(collection(db, "reservations"), where("time", "==", target), where("room", "==", room));
            const snap = await getDocs(q);
            if (!snap.empty) return showToast("🚫 이미 선점된 시간입니다.");

            await addDoc(collection(db, "reservations"), { user: email, room: room, time: target, shortTime: time });
            showToast("✅ 예약 확정!");
            document.getElementById('bookingModal').style.display = 'none';
        };

        document.getElementById('btnAdminOpen').onclick = async () => {
            const resSnap = await getDocs(collection(db, "reservations"));
            const list = document.getElementById('adminList');
            list.innerHTML = "";
            const sorted = [];
            resSnap.forEach(s => sorted.push({id: s.id, ...s.data()}));
            sorted.sort((a,b) => a.time.localeCompare(b.time)).forEach(d => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-[11px]";
                div.innerHTML = `<div><div class="font-black">${d.time.split('T')[0]} ${d.shortTime}</div><div>${d.room} (${d.user.split('@')[0]})</div></div>
                                 <div class="flex gap-1"><button class="bg-red-50 text-red-500 p-2 rounded-lg font-bold" onclick="deleteBooking('${d.id}')">취소</button>
                                 <button class="bg-slate-800 text-white p-2 rounded-lg font-bold" onclick="addToBlacklist('${d.user}')">차단</button></div>`;
                list.appendChild(div);
            });

            const blackSnap = await getDocs(collection(db, "blacklist"));
            const blackArea = document.getElementById('blackListArea');
            blackArea.innerHTML = "";
            blackSnap.forEach(s => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-red-50 p-2 rounded-lg text-red-700 font-bold text-[11px]";
                div.innerHTML = `<span>${s.data().email}</span><button onclick="removeFromBlacklist('${s.id}')" class="underline">해제</button>`;
                blackArea.appendChild(div);
            });
            document.getElementById('adminModal').style.display = 'flex';
        };

        window.deleteBooking = async (id) => { if(confirm('삭제?')) { await deleteDoc(doc(db, "reservations", id)); document.getElementById('btnAdminOpen').click(); }};
        window.addToBlacklist = async (email) => { if(confirm('차단?')) { await addDoc(collection(db, "blacklist"), { email }); document.getElementById('btnAdminOpen').click(); }};
        window.removeFromBlacklist = async (id) => { if(confirm('해제?')) { await deleteDoc(doc(db, "blacklist", id)); document.getElementById('btnAdminOpen').click(); }};

        document.getElementById('agreeRules').onchange = (e) => {
            const btn = document.getElementById('btnConfirm');
            btn.disabled = !e.target.checked;
            btn.className = e.target.checked ? "flex-[2] py-3 bg-emerald-600 text-white font-black rounded-xl text-sm shadow-lg" : "flex-[2] py-3 bg-slate-200 text-white font-black rounded-xl text-sm";
        };

        onSnapshot(collection(db, "reservations"), (snap) => {
            const evs = [];
            snap.forEach(s => { const d = s.data(); evs.push({ id: s.id, title: d.room, start: d.time, extendedProps: { shortTime: d.shortTime, user: d.user } }); });
            calendar.removeAllEvents(); calendar.addEventSource(evs);
        });

        onAuthStateChanged(auth, (u) => {
            document.getElementById('authModal').style.display = u ? 'none' : 'flex';
            document.getElementById('loginInfo').classList.toggle('hidden', !u);
            if(u) {
                document.getElementById('userNick').innerText = u.email.split('@')[0] + "님";
                if(isAdmin(u.email)) document.getElementById('btnAdminOpen').classList.remove('hidden');
            }
        });

        document.getElementById('btnGoogle').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('btnLogout').onclick = () => signOut(auth);
        calendar.render();
    </script>
</body>
</html>
