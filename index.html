<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muge v3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #bookingSection, #adminPanel, #userInfo { display: none; }
        
        /* 캘린더 커스텀 */
        .fc { background: white; padding: 12px; border-radius: 1.25rem; border: 1px solid #e2e8f0; height: 80vh; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .fc-header-toolbar { scale: 0.9; }

        /* [v3.5 핵심] 월 보기(DayGrid) 전용 텍스트 스타일 */
        .month-event-box { 
            display: flex; 
            align-items: center; 
            width: 100%;
            padding: 1px 0;
            overflow: hidden;
        }
        .month-time { 
            font-size: 10px; 
            background: rgba(0, 0, 0, 0.15); 
            color: white;
            padding: 0 4px; 
            border-radius: 3px; 
            font-weight: 600;
            margin-right: 5px;
            flex-shrink: 0; /* 시간 영역 고정 */
        }
        .month-room { 
            font-size: 11px; 
            font-weight: 700; 
            color: white;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        /* [v3.5 핵심] 주 보기(TimeGrid) 전용 스타일 */
        .week-event-box { padding: 4px; }
        .week-room { font-size: 0.85rem; font-weight: 800; display: block; color: white; margin-bottom: 2px; }
        .week-user { font-size: 0.75rem; font-weight: 400; color: rgba(255, 255, 255, 0.95); }

        .fc-event { border: none !important; margin: 1px 2px !important; }
    </style>
</head>
<body class="min-h-screen py-8">

    <div class="max-w-4xl mx-auto px-4">
        <header class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-3xl font-black text-blue-600 tracking-tighter">Muge v3.5</h1>
            <div id="userInfo" class="flex items-center gap-4 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100">
                <span id="userDisplay" class="text-xs font-bold text-slate-600"></span>
                <button id="btnLogout" class="text-xs text-red-500 font-bold">Logout</button>
            </div>
        </header>

        <section id="authForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <input type="email" id="emailInput" placeholder="Email" class="w-full px-4 py-3 rounded-xl border-slate-200 border outline-none focus:ring-2 focus:ring-blue-500/20 transition">
                <input type="password" id="passwordInput" placeholder="Password" class="w-full px-4 py-3 rounded-xl border-slate-200 border outline-none focus:ring-2 focus:ring-blue-500/20 transition">
            </div>
            <div class="flex gap-2">
                <button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-200">로그인</button>
                <button id="btnSignup" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 transition">회원가입</button>
            </div>
        </section>

        <section id="bookingSection" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-blue-600 mb-6">
            <h2 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-widest">Make a Reservation</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                <select id="roomName" class="px-4 py-3 rounded-xl border bg-slate-50 font-semibold outline-none focus:border-blue-500">
                    <option value="밴드실">🎸 밴드실</option>
                    <option value="제빵실">🍞 제빵실</option>
                    <option value="공작실">🔨 공작실</option>
                    <option value="강의실">📖 강의실</option>
                    <option value="다목적실">✨ 다목적실</option>
                </select>
                <input type="date" id="bookDate" class="px-4 py-3 rounded-xl border outline-none focus:border-blue-500">
                <select id="bookTimeSelect" class="px-4 py-3 rounded-xl border outline-none focus:border-blue-500"></select>
            </div>
            <button id="btnSave" class="w-full bg-slate-900 text-white font-black py-4 rounded-xl hover:bg-black transition-all active:scale-[0.98]">예약 확정하기</button>
        </section>

        <div id="calendar" class="mb-8"></div>

        <section id="adminPanel" class="bg-orange-50 p-6 rounded-2xl border border-orange-200 shadow-inner">
            <h2 class="text-sm font-black text-orange-700 mb-4 uppercase tracking-wider">User Approval Management</h2>
            <div id="userList" class="space-y-2"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, query, orderBy, addDoc, getDocs, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyAskjE4h_8V9lr0tNt_Bt-BwWzZlVhJe-8",
            "authDomain": "muge-43e73.firebaseapp.com",
            "projectId": "muge-43e73",
            "storageBucket": "muge-43e73.firebasestorage.app",
            "messagingSenderId": "356856775293",
            "appId": "1:356856775293:web:7ad8abaf66febd0a9be714"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserData = null;

        // 예약 가능 시간 설정
        const timeSelect = document.getElementById('bookTimeSelect');
        for (let h = 9; h <= 22; h++) {
            for (let m of ['00', '30']) {
                if (h === 22 && m === '30') continue;
                const hh = String(h).padStart(2, '0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${m}`; opt.textContent = `${hh}:${m}`;
                timeSelect.appendChild(opt);
            }
        }

        // 캘린더 초기화
        let calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'timeGridWeek',
            locale: 'ko',
            slotMinTime: '09:00:00',
            slotMaxTime: '22:00:00',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            displayEventTime: false,
            allDaySlot: false,
            
            // [v3.5 핵심] 월 보기/주 보기 정보 분리 렌더링
            eventContent: function(arg) {
                const room = arg.event.title.split(' | ')[0];
                const user = arg.event.title.split(' | ')[1];
                const timeStr = arg.event.extendedProps.shortTime;

                if (arg.view.type === 'dayGridMonth') {
                    // 월 보기: 시간(배지) + 장소명
                    return { html: `
                        <div class="month-event-box">
                            <span class="month-time">${timeStr}</span>
                            <span class="month-room">${room}</span>
                        </div>` 
                    };
                } else {
                    // 주 보기: 장소명(Bold) + 예약자
                    return { html: `
                        <div class="week-event-box">
                            <span class="week-room">${room}</span>
                            <span class="week-user">👤 ${user}</span>
                        </div>` 
                    };
                }
            },
            eventClick: async function(info) {
                const owner = info.event.extendedProps.user;
                if (auth.currentUser?.email === owner || currentUserData?.isAdmin) {
                    if (confirm(`예약을 취소하시겠습니까?\n[${info.event.title.split(' | ')[0]}]`)) {
                        await deleteDoc(doc(db, "reservations", info.event.id));
                    }
                } else { alert("본인의 예약만 관리 가능합니다."); }
            }
        });
        calendar.render();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userInfo.style.display = 'flex'; authForm.style.display = 'none'; bookingSection.style.display = 'block';
                document.getElementById('userDisplay').textContent = user.email.split('@')[0];
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if(snap.exists()) {
